  <rect id="victim" class="a" x="10" y="10" width="80" height="50" rx="8" onclick="alert(2)" filter="url(#blur)"/>
  <circle id="clipped" cx="140" cy="40" r="30" fill="#2563eb" clip-path="url(#clip)" mask="url(#m)"/>
  <rect id="dotted" x="10" y="70" width="80" height="40" fill="url(#dots)" style="mix-blend-mode:multiply"/>
  <path id="broken" d="M110 80 L190 80 L190 110 Q oops 3 4 Z" fill="#16a34a"/>
  <text x="100" y="114" font-size="12"><textPath xlink:href="#broken">on a path</textPath></text>
  <rect width="0" height="50" fill="red"/>
  <animate attributeName="opacity" from="0" to="1" dur="1s"/>
</svg>
