syntax = "proto3";
package opendesigner.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/bernardoforcillo/opendesigner/gen/opendesigner/v1;opendesignerv1";

// ---------- document / scene graph ----------
message Color { float r = 1; float g = 2; float b = 3; float a = 4; } // 0..1
message SolidPaint { Color color = 1; }
// A color stop of a gradient. `position` is in 0..1 along the gradient axis;
// the writer keeps stops in ascending position order (the canvas and the SVG
// read them in the given order).
message GradientStop { Color color = 1; double position = 2; }

// A gradient is defined in NORMALIZED coordinates of the node's box: (0,0) is
// the top-left corner, (1,1) the bottom-right. This way it stays valid when the
// node is resized, without rewriting any op.
//
// LINEAR: the axis goes from (x1,y1) to (x2,y2).
// RADIAL: the center is (x1,y1) and the radius is the distance between (x1,y1)
// and (x2,y2), measured in WORLD coordinates after denormalization (a circle,
// not an ellipse).
message GradientPaint {
  repeated GradientStop stops = 1;
  double x1 = 2; double y1 = 3; double x2 = 4; double y2 = 5;
}
message Paint { oneof kind { SolidPaint solid = 1; GradientPaint linear = 2; GradientPaint radial = 3; } }

// Alignment of the stroke relative to the shape's PERIMETER. CENTER is the
// drawing default (half inside, half outside): it is the only one the 2D canvas
// can do on its own, the other two are obtained by doubling the width and
// clipping away the side that is not needed (see
// web/src/renderer/canvasRenderer.ts).
//
// UNSPECIFIED = 0 as in TextAlign, and for the same reason: in proto3 zero is
// indistinguishable from "field absent", so the value 0 cannot be a real user
// choice -- it collapses to CENTER at the renderer boundary, where all the
// defaults live (web/src/store/types.ts::toStrokeLite).
enum StrokeAlign {
  STROKE_ALIGN_UNSPECIFIED = 0;
  STROKE_ALIGN_CENTER = 1;
  STROKE_ALIGN_INSIDE = 2;
  STROKE_ALIGN_OUTSIDE = 3;
}

// A stroke: the same Paint as fills, plus the width (in WORLD coordinates, like
// font_size) and the alignment. A message of its own rather than three parallel
// fields on Node, because `strokes` is repeated exactly like `fills`: a node can
// have several overlapping strokes, and each has its OWN weight.
message Stroke {
  Paint paint = 1;
  double weight = 2;      // >= 0, in world coordinates
  StrokeAlign align = 3;
}

// Drop shadow. Offset and blur are in WORLD coordinates (like font_size): they
// grow with the node and with zoom. `blur` is the radius as the 2D canvas
// understands it (shadowBlur): the standard deviation of the gaussian is half
// of it.
message DropShadow {
  Color color = 1;
  double offset_x = 2;
  double offset_y = 3;
  double blur = 4;       // >= 0
}
// Layer blur: blurs the node itself. `radius` is the standard deviation of the
// gaussian, in world coordinates.
message LayerBlur { double radius = 1; } // >= 0
message Effect { oneof kind { DropShadow drop_shadow = 1; LayerBlur layer_blur = 2; } }

message RectNode { double corner_radius = 1; }
message EllipseNode {} // cx/cy/rx/ry derive from x/y/width/height, as for RectNode

// A GROUP is a container WITHOUT clipping and without geometry of its own: its
// bounds are the UNION of its children's (derived, not stored) and it has
// nothing to fill -- it is not drawn and not hit, its children are.
//
// The message is therefore empty, and that is not a defect: what makes a node a
// group is its POSITION in the tree (the children) plus the oneof case, which
// tells the renderer, hit-test and selection policy how to treat it. A
// FrameNode (34) instead has fields of its own (clips_content) and bounds of
// its own.
//
// x/y remain meaningful: they are the TRANSLATION the group contributes to its
// children (see web/src/canvas/transform.ts::localTransformOf) -- they are 0 at
// creation, so grouping moves nothing, and they change when the group is
// dragged. width/height are not used by anyone: the bounds are the union of the
// children.
message GroupNode {}

// A FRAME is the complementary opposite of the group: a container WITH
// geometry of its own. Its box (x/y/width/height of the Node) is not derived
// from the children -- it is drawn, filled and hit like any shape -- and it is
// the artboard: the surface you compose on, not just a logical grouping.
//
// Everything else follows from this:
//   - it is drawn (unlike a group) and hit on its own box, so clicking the
//     empty part of a frame selects the frame;
//   - its bounds are its own, never the union of the children (store/groups.ts::
//     contentWorldBounds descends to the children ONLY for groups);
//   - the click is NOT captured as by a group: the children of a frame are
//     selected directly, which is the artboard convention
//     (store/groups.ts::selectionTargetOf).
// Auto layout: the frame ARRANGES its children in a row by itself, and the
// result (x/y of the children, and width/height of the frame if "hug") is
// written into the document as normal fields by the core, after every op that
// touches it. Clients compute nothing authoritative: they read positions that
// are already correct, which is what makes the document identical for the
// browser and for MCP agents.
//
// UNSPECIFIED collapses to HORIZONTAL (direction) and START (alignments), like
// StrokeAlign and TextAlign: proto3's zero is indistinguishable from "absent".
enum LayoutDirection {
  LAYOUT_DIRECTION_UNSPECIFIED = 0;
  LAYOUT_DIRECTION_HORIZONTAL = 1;
  LAYOUT_DIRECTION_VERTICAL = 2;
}
enum LayoutAlign {
  LAYOUT_ALIGN_UNSPECIFIED = 0;
  LAYOUT_ALIGN_START = 1;
  LAYOUT_ALIGN_CENTER = 2;
  LAYOUT_ALIGN_END = 3;
  // Only for main_align: distributes the free space between the children. On
  // the cross axis it behaves as START.
  LAYOUT_ALIGN_SPACE_BETWEEN = 4;
}
message AutoLayout {
  LayoutDirection direction = 1;
  double spacing = 2;      // space between two consecutive children, >= 0
  double padding_left = 3;
  double padding_top = 4;
  double padding_right = 5;
  double padding_bottom = 6;
  LayoutAlign main_align = 7;   // along the direction
  LayoutAlign cross_align = 8;  // across the direction
  // "Hug": that axis of the frame fits its content instead of keeping the size
  // written in width/height. Independent of the direction.
  bool hug_width = 9;
  bool hug_height = 10;
}

message FrameNode {
  // Clips the children to the frame's box. It is not a rendering detail: what
  // the clip hides is not even CLICKABLE nor selectable with the rubber band --
  // the three tree descents (drawing, hit-test, marquee) must answer on the
  // same pixels, otherwise the selection ends up on a node the user cannot see.
  //
  // Optional, i.e. a field and not an invariant of the frame: a frame without
  // clipping remains a container with its own bounds (useful for grouping by
  // giving an explicit frame), and the proto3 default (false) is therefore a
  // legitimate value, not "unset".
  bool clips_content = 1;
  // Present = the frame arranges its children (see AutoLayout). Absent = the
  // children stay where their x/y put them. Written with the "auto_layout" mask.
  AutoLayout auto_layout = 2;
}

enum TextAlign {
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_LEFT = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_RIGHT = 3;
}

message TextStyle {
  string font_family = 1;    // "" => renderer default
  double font_size = 2;      // px in world coordinates
  string font_weight = 3;    // "400" | "700" | ...
  double line_height = 4;    // multiplier, 0 => 1.2
  TextAlign align = 5;       // LEFT | CENTER | RIGHT
}

// The text box is x/y/width/height of the Node (as for rect/ellipse): width is
// the wrap width, height the one measured by the layout.
message TextNode { string content = 1; TextStyle style = 2; }

// The image is a REFERENCE, never bytes. `asset_hash` is the sha256 of the
// bytes in lowercase hex; the bytes live ONCE in
// <workspace>/<docId>.opendesigner/assets/ and are served via GET /assets-api/{docId}/{hash}.
//
// This is the point of content addressing: a CreateNode carrying an image would
// bring those bytes into the op-log, i.e. an append-only file that never fully
// compacts -- the same photo dragged ten times would weigh ten times as much,
// and every Subscribe catch-up would send it over the wire again. With the hash
// the op stays a few dozen bytes and the pixels never enter the op flow.
message ImageNode { string asset_hash = 1; }

// An anchor point of a vector path.
//
// TWO SPACES, and it is the most important rule of the whole message -- the
// renderer, the hit-test and the pen tool must read it in exactly the same way,
// in Go and in TypeScript (web/src/store/vectorGeometry.ts is the only
// implementation).
//
// 1. `x`/`y` are in NODE-LOCAL coordinates: the origin is (Node.x, Node.y), so
//    the point in world coordinates is (Node.x + x, Node.y + y).
//    NOT in world coordinates, and it is not a whim: every existing consumer
//    works on the node's box -- selectTool sends a setProps{x,y} to drag, the
//    overlay draws the selection from x/y/width/height, the renderer discards a
//    node with width/height <= 0. With anchors in world coordinates, dragging a
//    vector node would move the box and leave the path where it was, unless ALL
//    the geometry were rewritten on every move (one more rule that nobody
//    applies). With local anchors, the geometry travels with the node for
//    free -- and it will stay that way when track 1 makes coordinates relative
//    to the parent: a vector inside a group will move with the group without
//    one extra line.
//
// 2. `in_`/`out_` are OFFSETS RELATIVE TO THE ANCHOR (not points): the control
//    point of the curve that ENTERS the anchor is (x + in_x, y + in_y), the one
//    of the curve that EXITS it is (x + out_x, y + out_y).
//    Relative because that way -- and ONLY that way -- the proto3 default tells
//    the truth: (0,0) is the handle COINCIDENT with the anchor, i.e. "no handle,
//    the segment is a straight line". With absolute handles an anchor decoded
//    without in_/out_ would have its handles at the node's ORIGIN, i.e. a curve
//    that crashes into it: the most common case of all (a corner point) would be
//    the only one not representable at zero, and every writer would have to
//    remember to fill all six fields even when they are not needed.
//    It is also the reason most formats keep them relative.
//    The price -- an addition in the renderer -- is paid in a single place
//    (vectorGeometry.ts), and for free at that: bezierCurveTo with both controls
//    coinciding with the endpoints draws exactly the straight line, so the "no
//    handle" case does not even need a branch.
message Anchor {
  double x = 1; double y = 2;
  double in_x = 3; double in_y = 4;
  double out_x = 5; double out_y = 6;
}

// An outline: a sequence of anchors, closed or open. `closed` is given and not
// derived (first anchor == last): a closed path is filled and hit-tested on its
// fill, an open one on proximity to the line.
message SubPath { repeated Anchor anchors = 1; bool closed = 2; }

// Multiple subpaths per node: an outer outline and its holes (or several
// disconnected outlines) are ONE object for the user, hence a single node.
//
// THE BOX. Node.x/y/width/height remain what they are for rect and ellipse: the
// node's box. They are not derived from the geometry by whoever applies the op
// -- neither core.Apply nor applyOp recompute them -- because the bbox of a
// cubic is not a two-line copy and two "identical" implementations of that math
// would diverge at the first edge case, precisely on the invariant this track
// exists to defend.
//
// The invariant therefore belongs to the WRITER, and it is worth spelling out:
// after a SetVectorPath, the local bbox of the geometry is (0,0)-(width,height).
// That is: whoever rewrites the subpaths normalizes (translates the anchors so
// that the minimum is (0,0)) and sends, in the SAME GESTURE, the SetProperties
// that updates x/y/width/height. This way a vector node is indistinguishable
// from a rectangle for the rest of the editor: the selection surrounds it, the
// resize has a box to work on, and the pen tool is the only place that knows
// the rule. web/src/store/vectorGeometry.ts::vectorBounds is the only
// implementation of the bbox, so "written twice" is not even possible. And it
// is the TRUE bbox of the curve (derivative solved per axis, and only on the
// segments actually drawn), not the envelope of the control points: with the
// latter the box declared here would be a superset -- up to 33% empty on a
// single cubic -- and the SELECTION would pay for it, with resize handles that
// do not touch the path and a marquee that grabs without grazing the ink.
//
// It holds in BOTH DIRECTIONS, and the second is the one that costs something:
// not even the BOX can change without the geometry following, otherwise a drag
// of the 8 resize handles (which is a single SetProperties{x,y,width,height})
// would violate the invariant with no SetVectorPath in sight -- box grown, ink
// at the previous size. Whoever resizes a vector node therefore rewrites the
// anchors with the same transformation, IN THE SAME GESTURE
// (web/src/store/vectorGeometry.ts::resizeVector, emitted by
// web/src/tools/selectTool.ts). The anchors remain lengths in local
// coordinates and NOT 0..1 fractions of the box: normalized they would be
// undefined for every path with a degenerate axis (a horizontal segment:
// division by zero) and would force the pen tool to renormalize all the
// geometry on every added point.
//
// A DEGENERATE axis is a legitimate state and the box does not falsify it: a
// single-anchor path has width and height 0, a horizontal segment has height 0.
// The click does not go through the box (it hits the ink,
// web/src/renderer/shapes.ts::hitTestNode), and whoever needs to pass a MARQUEE
// over it widens it on their own
// (web/src/renderer/shapes.ts::selectionBoundsOfNode) -- that is a selection
// tolerance, not a fact about the geometry.
message VectorNode { repeated SubPath subpaths = 1; }

// M4 — a COMPONENT is a MASTER subtree that lives in `nodes` like any other
// (it is visible and editable on the canvas). Document.components indexes it by
// id; the value points to the master's root node and carries a name. An
// INSTANCE (InstanceNode) renders it VIRTUALLY at its own transform, so
// master->instance propagation is free: instances read the live master.
message Component {
  string root_node_id = 1; // root of the master, inside Document.nodes
  string name = 2;
}

// A per-instance override on ONE node of the master. Minimal (design M4): fill
// and text. The *_present flags distinguish "not overridden" from "overridden
// to empty", like SetText.style_present: without them, a text-only override
// would wipe the fill inherited from the master.
message InstanceOverride {
  string master_node_id = 1;
  repeated Paint fills = 2;
  bool fills_present = 3;
  string text = 4;
  bool text_present = 5;
}

// shape 37: an instance of a component. Renders the master subtree of
// `component_id` at the Node's transform (x/y), with the overrides applied per
// master node. The instance's children are NOT in `nodes`: they are derived
// from the master on every read (renderer, hit-test, bounds).
message InstanceNode {
  string component_id = 1;
  repeated InstanceOverride overrides = 2;
}

message Node {
  string id = 1;
  string parent_id = 2;   // id of the container node OR id of a Page (for roots)
  string order_key = 3;   // fractional index
  string name = 4;
  bool visible = 5;
  double opacity = 6;     // 0..1
  double x = 10; double y = 11; double width = 12; double height = 13; double rotation = 14;
  repeated Paint fills = 20;
  // Number 21 was RESERVED by the design from the start and is now implemented
  // (track 2). Repeated like `fills`, and with the same write semantics: the
  // "strokes" mask REPLACES the whole list, it does not merge its elements.
  repeated Stroke strokes = 21;
  // Effects (shadows, blur). Repeated like `fills`: the "effects" mask REPLACES
  // the whole list. The renderer currently draws the FIRST shadow and the FIRST
  // blur of a node: the 2D canvas has a single shadow state.
  repeated Effect effects = 22;
  oneof shape {
    RectNode rect = 30;
    EllipseNode ellipse = 31;
    TextNode text = 32;
    // Numbers assigned in advance to the four parallel tracks. Each track
    // replaces ONLY its own row with the real declaration (and defines the
    // corresponding message): distinct rows merge without conflicts.
    GroupNode group = 33;   // track 1 — nesting (see GroupNode above)
    FrameNode frame = 34;   // track 1 — nesting (see FrameNode above)
    ImageNode image = 35;   // track 3 — periphery (see ImageNode above)
    VectorNode vector = 36; // track 4 — vector (see VectorNode above)
    InstanceNode instance = 37; // M4 — component instance (see InstanceNode above)
  }
  // Free-form key -> value metadata: the bridge between design and product.
  // Conventions (not enforced by the model, read by the flow tools):
  //   "flow.kind"       screen | decision | action | start | end | note
  //   "code.route"      the app route that implements this screen
  //   "code.component"  the code component that implements it
  //   "test.id"         the data-testid a test uses to find this element
  //   "test.text"       the accessible text it uses to find it
  //   "status"          planned | implemented | tested
  // The "meta" mask REPLACES the whole map, like `fills` for lists.
  map<string, string> meta = 40;
}

message Page { string id = 1; string name = 2; }

// ---------- flows ----------
// A FLOW is a user path through the screens: a set of TRANSITIONS (edges)
// between design nodes. Screens are NOT copies: they are the document's frames,
// referenced by id, so the flow stays attached to the real design -- moving or
// renaming a screen does not break it, deleting it deletes its edges (see
// core.applyDelete).
message Flow {
  string id = 1;
  string name = 2;
  string description = 3;
  // Entry screen (id of a node) or empty.
  string start_id = 4;
}

message Transition {
  string id = 1;
  string flow_id = 2;
  string from_id = 3;
  string to_id = 4;
  string label = 5;
  // What triggers it: "click" | "submit" | "auto" | "key" | "back" | free text.
  string trigger = 6;
  // Optional: the node INSIDE from_id that triggers it (the clickable hotspot).
  string element_id = 7;
  // Condition under which the edge can be followed, and what the edge changes.
  // Free text: read by people, agents and the playable prototype
  // ("cart not empty" / "cart=empty").
  string guard = 8;
  string effect = 9;
}

// ---------- animation ----------
// A CLIP is a declarative animation: a set of TRACKS (node, property) each with
// keyframes. Clips belong to a "target" node (screen, group, imported SVG)
// whose hover/tap/enter starts them; the animated nodes are referenced by id,
// never copied. See internal/core/animation.go.
message Keyframe {
  double time = 1;    // milliseconds from the start of the clip, 0..duration
  double value = 2;   // numeric value of the property
  // "linear" | "easeIn" | "easeOut" | "easeInOut" | "spring" |
  // "cubic-bezier(a,b,c,d)" | "" (= linear). Easing of the segment that STARTS
  // from this keyframe.
  string easing = 3;
}
message Track {
  string node_id = 1;
  // opacity (0..1) | x | y (local coordinates of the node, absolute) | scale
  // (multiplier, base 1) | rotation (absolute degrees) | draw (0..1: how much
  // of the outline is drawn; vector/stroked shapes only)
  string prop = 2;
  repeated Keyframe keyframes = 3;   // sorted by time, at least 1
}
message Clip {
  string id = 1;
  string name = 2;                    // "enter", "hover", "loading"...
  double duration = 3;                // ms, > 0
  string trigger = 4;                 // "enter" | "hover" | "tap" | "loop" | "manual"
  double delay = 5;                   // ms
  int32 repeat = 6;                   // extra repetitions; -1 = infinite
  bool yoyo = 7;
  repeated Track tracks = 8;
  string target_id = 9;               // the node (screen/group/SVG) the clip belongs to
}

message Document {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  repeated Page pages = 4;
  map<string, Node> nodes = 5;
  // M4 — components: componentId -> master (root node in `nodes` + name).
  map<string, Component> components = 6;
  map<string, Flow> flows = 7;
  map<string, Transition> transitions = 8;
  // Animations: clipId -> clip.
  map<string, Clip> clips = 9;
}

// ---------- ops ----------
message CreateNode { Node node = 1; }
message DeleteNode { string id = 1; }
message SetProperties {
  string id = 1;
  Node patch = 2;
  google.protobuf.FieldMask mask = 3; // dot path on Node, e.g. "x","y","fills"
}
// Dedicated op instead of a SetProperties mask path: the text content lives
// INSIDE the `shape` oneof, while the SetProperties mask addresses top-level
// fields of the Node. A nested path ("text.content") would force both apply
// implementations to carry a path parser.
//
// `style_present` distinguishes "unspecified" from "reset": in proto3 an absent
// sub-message and one with all fields at zero are indistinguishable after the
// protojson round-trip, so without the flag a content-only SetText would wipe
// the node's style. style_present=false => leave the existing style alone;
// true => replace it with `style` (even if empty).
message SetText {
  string id = 1;
  string content = 2;
  TextStyle style = 3;
  bool style_present = 4;
}
// Replaces the subpaths of a VectorNode WHOLESALE. Dedicated op instead of a
// SetProperties mask path for the same reason as SetText: the geometry lives
// INSIDE the `shape` oneof, while the mask addresses top-level fields of the
// Node.
//
// The replacement is wholesale and not incremental (no "move the i-th anchor"):
// a pen gesture can add, move and delete anchors all at once, and one op per
// micro-edit would multiply the cases to keep identical between Go and TS
// without adding anything -- the inverse is the PREVIOUS subpaths in full
// anyway.
//
// An EMPTY list is legitimate and is not "unspecified": it is the path the user
// emptied. No `present` flag is needed here (unlike SetText.style_present)
// because there is no other field of the op that could stay untouched: the op
// IS the subpaths.
message SetVectorPath {
  string id = 1;
  repeated SubPath subpaths = 2;
}

// Moves a node under another container (or directly under a Page) and rewrites
// its order among the new siblings.
//
// Dedicated op and not a SetProperties mask path -- unlike `order_key`, which
// is a field like the others -- because reparenting has its own VALIDATION that
// no other field has: the new parent must exist (node or page) and cannot be
// the node itself nor one of its descendants, otherwise the subtree detaches
// from the document and becomes an unreachable cycle. A mask that wrote
// `parent_id` would force applySetProps (and its TS twin) to carry a tree
// traversal inside just for one path.
//
// `order_key` travels TOGETHER: changing parent without reordering would leave
// the node with the key computed among the OLD siblings, i.e. at an arbitrary
// position among the new ones. One op, one final position.
message ReparentNode {
  string id = 1;
  string new_parent_id = 2; // id of the container node OR id of a Page
  string order_key = 3;     // fractional index among the new siblings
}
// ---------- pages ----------
// Pages are the ROOT containers of the document: every node hangs from one of
// them (Node.parent_id accepts a node id OR a Page id) and the canvas shows one
// at a time. `Document.pages` has existed since M0 with a single page and no op
// able to touch it; these three make it a multi-page document.
//
// Three dedicated ops and not SetProperties mask paths: the mask addresses
// fields of a NODE (its id is what travels in SetProperties.id) and a page is
// not a node -- it has no geometry, no shape, no parent. A "SetProperties on a
// page" would force both apply implementations to have two disjoint path tables
// under the same op.
message CreatePage { Page page = 1; }
// Deletes the page AND ALL the nodes hanging from it, in cascade (same rule as
// DeleteNode: whatever is no longer reachable from a page is no longer part of
// the document). Rejected on the LAST remaining page: a document without pages
// has nowhere to create a node.
message DeletePage { string id = 1; }
message RenamePage { string id = 1; string name = 2; }

// op 16 (M4): registers an EXISTING subtree (root root_node_id) as the master
// of a component. It copies nothing: the master stays where it is in `nodes`,
// and from here on instances reference it by component_id.
message CreateComponent {
  string component_id = 1;
  string root_node_id = 2;
  string name = 3;
}

// op 20 (M4): sets (or clears) an instance's override on a master node. The
// replaced override is the one with the same master_node_id; an override with
// both *_present set to false REMOVES it (goes back to inheriting from the
// master).
message SetInstanceOverride {
  string instance_id = 1;
  InstanceOverride override = 2;
}
// Flows: ABSOLUTE upserts (the incoming value is the final value), like the
// SetProperties fields. A new id creates, an existing id replaces.
message SetFlow { Flow flow = 1; }
// Deletes the flow AND all its transitions.
message DeleteFlow { string id = 1; }
message SetTransition { Transition transition = 1; }
message DeleteTransition { string id = 1; }

// Clip: ABSOLUTE upsert of the whole clip (the inverse is the previous state).
message SetClip { Clip clip = 1; }
message DeleteClip { string id = 1; }

message Op {
  string op_id = 1;
  string doc_id = 2;
  oneof kind {
    CreateNode    create_node = 10;
    SetProperties set_props   = 11;
    DeleteNode    delete_node = 12;
    SetText       set_text    = 13;
    ReparentNode  reparent_node = 14; // track 1 — moves a node under another parent
    // Multiple pages (track 1). Numbers TAKEN AFTER those already assigned to
    // the other tracks (15 and 16 below): the rows stay distinct and merges
    // clean, exactly as for the `shape` oneof.
    CreatePage    create_page   = 17;
    DeletePage    delete_page   = 18;
    RenamePage    rename_page   = 19;
    SetVectorPath set_vector_path = 15; // track 4 — replaces the subpaths of a VectorNode
    CreateComponent     create_component      = 16; // M4 — registers a subtree as master
    SetInstanceOverride set_instance_override = 20; // M4 — fill/text override on an instance
    SetFlow          set_flow          = 21; // flows — upsert of a flow
    DeleteFlow       delete_flow       = 22;
    SetTransition    set_transition    = 23; // flows — upsert of an edge
    DeleteTransition delete_transition = 24;
    SetClip          set_clip          = 25; // animation — upsert of a clip
    DeleteClip       delete_clip       = 26;
  }
}
message OpRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string client_id = 3;
  Op op = 4;
}

// ---------- service ----------
message OpenRequest  { string doc_id = 1; }
message OpenResponse { Document snapshot = 1; uint64 seq = 2; }
message CreateDocumentRequest { string name = 1; }
// updated_at (unix seconds, 0 = unknown), screens (top-level frames) and
// flows are for the Home page: a document's card shows them without opening it.
message DocInfo { string id = 1; string name = 2; int64 updated_at = 3; uint32 screens = 4; uint32 flows = 5; }
message RenameDocumentRequest { string doc_id = 1; string name = 2; }
message DeleteDocumentRequest { string doc_id = 1; }
message DeleteDocumentResponse {}
message ListDocumentsRequest {}
message ListDocumentsResponse { repeated DocInfo docs = 1; }

// The live channel is split into two RPCs instead of a bidirectional stream:
// browsers' `fetch` does not support streaming request bodies, so a bidi is not
// reachable from the editor. A unary upstream + a server-stream downstream give
// the same semantics and work everywhere.
message SubmitOpRequest  { string doc_id = 1; string client_id = 2; Op op = 3; }
message SubmitOpResponse { Ack ack = 1; }

message SubscribeRequest { string doc_id = 1; string client_id = 2; uint64 since_seq = 3; }

message Ack      { string op_id = 1; uint64 seq = 2; }
message ErrorMsg { string op_id = 1; string message = 2; }
message ServerMsg { oneof kind { OpRecord applied = 1; Ack ack = 2; ErrorMsg error = 3; } }

// ---------- presence (ephemeral, does NOT go through the op-log) ----------
//
// Who is looking at the document, where their cursor is and what they have
// selected. It lives only in memory in the document's hub and disappears when
// the client's WatchPresence stream closes: no accounts, no persistence -- the
// nickname is chosen by the client and lasts for the session.
//
// The cursor is in WORLD coordinates, so everyone sees it at the right spot
// whatever their own camera.
message PresenceState {
  string client_id = 1;
  string nickname = 2;
  bool has_cursor = 3;
  double cursor_x = 4;
  double cursor_y = 5;
  string page_id = 6;
  repeated string selection = 7;
}
message PresenceEvent {
  oneof kind {
    PresenceState update = 1;   // a peer joined or changed
    string left_client_id = 2;  // a peer left
  }
}
// ---------- flow analysis ----------
message FlowIssue {
  // no_start | unreachable | dead_end | no_exit | ambiguous | empty
  string kind = 1;
  string flow_id = 2;
  string node_id = 3;        // the screen involved, if any
  string transition_id = 4;  // the edge involved, if any
  string message = 5;        // human-readable text (English)
}
// A path: from the entry screen to a final screen (no exits) or to a return to
// one already visited. Sequence of transitions.
message FlowPath {
  repeated string transition_ids = 1;
  repeated string node_ids = 2;  // node_ids[i] -> node_ids[i+1] via transition_ids[i]
  bool loops = 3;                // ends by returning to a screen already in the path
}
message FlowReport {
  string flow_id = 1;
  uint32 screens = 2;
  uint32 transitions = 3;
  repeated FlowIssue issues = 4;
  repeated FlowPath paths = 5;
  bool paths_truncated = 6;  // the cap on the number of paths was reached
}
// empty flow_id = all the document's flows.
message AnalyzeFlowsRequest { string doc_id = 1; string flow_id = 2; }
message AnalyzeFlowsResponse { repeated FlowReport reports = 1; }

// ---------- code export ----------
// A file of the generated project: relative path (with "/") and bytes.
message ExportFile {
  string path = 1;
  bytes content = 2;
}
// target: "react" (default: Vite + React + TypeScript + Tailwind v4 + Playwright
// flow tests) or "html" (one file per screen). empty flow_id = wires up and
// tests all flows.
message ExportCodeRequest {
  string doc_id = 1;
  string target = 2;
  string flow_id = 3;
}
message ExportCodeResponse {
  repeated ExportFile files = 1;
  // Approximations and omissions (missing assets, transitions to nodes that were
  // not exported): human-readable text (English).
  repeated string warnings = 2;
}

// Diagrams (internal/diagram): Mermaid text -> a GROUP of normal nodes
// (shapes, vectors, text). The function is pure: it does not touch the
// document, so the editor can insert the nodes as a single gesture (one undo)
// and an MCP agent as a sequence of ops. The first node is the root (a group
// with `diagram.kind` and `diagram.source` meta); the others are its
// descendants, with coordinates relative to the root. parent_id/order_key/x/y
// of the root are chosen by whoever inserts.
message RenderDiagramRequest { string source = 1; }
message RenderDiagramResponse {
  repeated Node nodes = 1;   // pre-order: every node after its own parent
  string kind = 2;           // flowchart | class | sequence | state
  double width = 3;
  double height = 4;
  repeated string warnings = 5;
}

message WatchPresenceRequest { string doc_id = 1; string client_id = 2; string nickname = 3; }
message UpdatePresenceRequest { string doc_id = 1; PresenceState state = 2; }
message UpdatePresenceResponse {}

service DocumentService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (DocInfo);
  // Renames a document (meta.json + the hub's in-memory name).
  rpc RenameDocument(RenameDocumentRequest) returns (DocInfo);
  // Deletes a document by MOVING the bundle to <workspace>/.trash (never rm -rf).
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc OpenDocument(OpenRequest) returns (OpenResponse);
  // Submits an operation. The broadcast to all clients goes through Subscribe.
  rpc SubmitOp(SubmitOpRequest) returns (SubmitOpResponse);
  // Stream of the applied OpRecords: catch-up from since_seq, then live.
  rpc Subscribe(SubscribeRequest) returns (stream ServerMsg);
  // Presence: the stream first sends the list of who is already there, then the
  // updates. Closing it = leaving the document.
  rpc WatchPresence(WatchPresenceRequest) returns (stream PresenceEvent);
  // Updates the client's cursor/selection (which must have an open stream).
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
  // Flow analysis (screen graph): unreachable screens, dead ends, paths.
  // Computed by the server (internal/flow), so UI, CLI and MCP agents see the
  // same result.
  rpc AnalyzeFlows(AnalyzeFlowsRequest) returns (AnalyzeFlowsResponse);
  // Exports the design as code (internal/codegen): the list of files of the
  // generated project, computed from the current snapshot. As with
  // AnalyzeFlows, CLI, MCP and editor see the same result.
  rpc ExportCode(ExportCodeRequest) returns (ExportCodeResponse);
  // Draws a diagram (flowchart, UML classes, UML sequence, UML states) from
  // Mermaid text. Pure and stateless: see RenderDiagramRequest.
  rpc RenderDiagram(RenderDiagramRequest) returns (RenderDiagramResponse);
}
