syntax = "proto3";
package opendesigner.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/bernardoforcillo/opendesigner/gen/opendesigner/v1;opendesignerv1";

// ---------- documento / scene graph ----------
message Color { float r = 1; float g = 2; float b = 3; float a = 4; } // 0..1
message SolidPaint { Color color = 1; }
// Un punto di colore di un gradiente. `position` è in 0..1 lungo l'asse del
// gradiente; gli stop sono tenuti in ordine crescente di posizione da chi li
// scrive (il canvas e l'SVG li leggono nell'ordine dato).
message GradientStop { Color color = 1; double position = 2; }

// Un gradiente è definito in coordinate NORMALIZZATE del box del nodo: (0,0) è
// l'angolo in alto a sinistra, (1,1) quello in basso a destra. Così resta
// valido quando il nodo viene ridimensionato, senza riscrivere nessun op.
//
// LINEARE: l'asse va da (x1,y1) a (x2,y2).
// RADIALE: il centro è (x1,y1) e il raggio è la distanza fra (x1,y1) e (x2,y2),
// misurata in coordinate MONDO dopo la denormalizzazione (cerchio, non ellisse).
message GradientPaint {
  repeated GradientStop stops = 1;
  double x1 = 2; double y1 = 3; double x2 = 4; double y2 = 5;
}
message Paint { oneof kind { SolidPaint solid = 1; GradientPaint linear = 2; GradientPaint radial = 3; } }

// Allineamento del tratto rispetto al PERIMETRO della forma. CENTER è il
// default del disegno (metà dentro, metà fuori): è l'unico che il canvas 2D sa
// fare da solo, gli altri due si ottengono raddoppiando la larghezza e
// ritagliando il lato che non serve (vedi web/src/renderer/canvasRenderer.ts).
//
// UNSPECIFIED = 0 come in TextAlign, e per la stessa ragione: in proto3 lo zero
// non si distingue da "campo assente", quindi il valore 0 non può essere una
// scelta vera dell'utente -- collassa su CENTER al bordo del renderer, dove
// vivono tutti i default (web/src/store/types.ts::toStrokeLite).
enum StrokeAlign {
  STROKE_ALIGN_UNSPECIFIED = 0;
  STROKE_ALIGN_CENTER = 1;
  STROKE_ALIGN_INSIDE = 2;
  STROKE_ALIGN_OUTSIDE = 3;
}

// Un tratto: la stessa Paint dei riempimenti, più la larghezza (in coordinate
// MONDO, come font_size) e l'allineamento. Messaggio a sé e non tre campi
// paralleli sul Node, perché `strokes` è ripetuto esattamente come `fills`: un
// nodo può avere più tratti sovrapposti, e ciascuno ha il PROPRIO peso.
message Stroke {
  Paint paint = 1;
  double weight = 2;      // >= 0, in coordinate mondo
  StrokeAlign align = 3;
}

// Ombra esterna. Offset e sfocatura sono in coordinate MONDO (come font_size):
// crescono col nodo e con lo zoom. `blur` è il raggio come lo intende il canvas
// 2D (shadowBlur): la deviazione standard della gaussiana è la sua metà.
message DropShadow {
  Color color = 1;
  double offset_x = 2;
  double offset_y = 3;
  double blur = 4;       // >= 0
}
// Sfocatura del livello: sfoca il nodo stesso. `radius` è la deviazione
// standard della gaussiana, in coordinate mondo.
message LayerBlur { double radius = 1; } // >= 0
message Effect { oneof kind { DropShadow drop_shadow = 1; LayerBlur layer_blur = 2; } }

message RectNode { double corner_radius = 1; }
message EllipseNode {} // cx/cy/rx/ry derivano da x/y/width/height, come per RectNode

// Un GRUPPO è un contenitore SENZA clipping e senza geometria propria: i suoi
// bounds sono l'UNIONE di quelli dei figli (derivati, non memorizzati) e non ha
// niente da riempire -- non si disegna e non si colpisce, si colpiscono i figli.
//
// Il messaggio è quindi vuoto, e non è un difetto: ciò che rende un nodo un
// gruppo è la sua POSIZIONE nell'albero (i figli) più il caso del oneof, che
// dice a renderer, hit-test e politica di selezione come trattarlo. Un
// FrameNode (34) avrà invece campi propri (clips_content) e bounds propri.
//
// x/y restano significativi: sono la TRASLAZIONE che il gruppo contribuisce ai
// figli (vedi web/src/canvas/transform.ts::localTransformOf) -- valgono 0 alla
// creazione, così raggruppare non sposta nulla, e cambiano quando il gruppo
// viene trascinato. width/height non sono usati da nessuno: i bounds sono
// l'unione dei figli.
message GroupNode {}

// Un FRAME è l'opposto complementare del gruppo: un contenitore CON geometria
// propria. Il suo box (x/y/width/height del Node) non è derivato dai figli --
// è disegnato, riempito e colpito come una forma qualunque -- ed è l'artboard:
// la superficie su cui si compone, non solo un raggruppamento logico.
//
// Da qui discende tutto il resto:
//   - si disegna (a differenza di un gruppo) e si colpisce sul proprio box,
//     quindi cliccare la parte vuota di un frame seleziona il frame;
//   - i suoi bounds sono i suoi, mai l'unione dei figli (store/groups.ts::
//     contentWorldBounds risale ai figli SOLO per i gruppi);
//   - il click NON viene catturato come da un gruppo: i figli di un frame si
//     selezionano direttamente, che è la convenzione degli artboard
//     (store/groups.ts::selectionTargetOf).
// Auto layout: il frame DISPONE da sé i propri figli in fila, e il risultato
// (x/y dei figli, e width/height del frame se "hug") è scritto nel documento
// come campi normali dal core, dopo ogni op che lo tocca. I client non
// calcolano niente di autoritativo: leggono posizioni già a posto, che è ciò
// che rende il documento identico per il browser e per gli agenti MCP.
//
// UNSPECIFIED collassa su HORIZONTAL (direzione) e START (allineamenti), come
// StrokeAlign e TextAlign: lo zero di proto3 non si distingue da "assente".
enum LayoutDirection {
  LAYOUT_DIRECTION_UNSPECIFIED = 0;
  LAYOUT_DIRECTION_HORIZONTAL = 1;
  LAYOUT_DIRECTION_VERTICAL = 2;
}
enum LayoutAlign {
  LAYOUT_ALIGN_UNSPECIFIED = 0;
  LAYOUT_ALIGN_START = 1;
  LAYOUT_ALIGN_CENTER = 2;
  LAYOUT_ALIGN_END = 3;
  // Solo per main_align: distribuisce lo spazio libero fra i figli. Sull'asse
  // trasversale vale START.
  LAYOUT_ALIGN_SPACE_BETWEEN = 4;
}
message AutoLayout {
  LayoutDirection direction = 1;
  double spacing = 2;      // spazio fra due figli consecutivi, >= 0
  double padding_left = 3;
  double padding_top = 4;
  double padding_right = 5;
  double padding_bottom = 6;
  LayoutAlign main_align = 7;   // lungo la direzione
  LayoutAlign cross_align = 8;  // attraverso la direzione
  // "Hug": quell'asse del frame si adatta al contenuto invece di tenere la
  // misura scritta in width/height. Indipendenti dalla direzione.
  bool hug_width = 9;
  bool hug_height = 10;
}

message FrameNode {
  // Ritaglia i figli al box del frame. Non è un dettaglio di rendering: ciò
  // che il ritaglio nasconde non è nemmeno CLICCABILE né selezionabile con la
  // banda elastica -- le tre discese dell'albero (disegno, hit-test, marquee)
  // devono rispondere sugli stessi pixel, altrimenti la selezione finisce su
  // un nodo che l'utente non vede.
  //
  // Opzionale, cioè un campo e non un invariante del frame: un frame senza
  // clipping resta un contenitore con bounds propri (utile per raggruppare
  // dando una cornice esplicita), e il default proto3 (false) è quindi un
  // valore legittimo, non "non impostato".
  bool clips_content = 1;
  // Presente = il frame dispone i figli (vedi AutoLayout). Assente = i figli
  // stanno dove li mettono i loro x/y. Si scrive con la mask "auto_layout".
  AutoLayout auto_layout = 2;
}

enum TextAlign {
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_LEFT = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_RIGHT = 3;
}

message TextStyle {
  string font_family = 1;    // "" => default del renderer
  double font_size = 2;      // px in coordinate mondo
  string font_weight = 3;    // "400" | "700" | ...
  double line_height = 4;    // moltiplicatore, 0 => 1.2
  TextAlign align = 5;       // LEFT | CENTER | RIGHT
}

// Il box del testo è x/y/width/height del Node (come rect/ellipse): width è la
// larghezza di wrap, height quella misurata dal layout.
message TextNode { string content = 1; TextStyle style = 2; }

// L'immagine è un RIFERIMENTO, mai dei byte. `asset_hash` è lo sha256 dei byte
// in esadecimale minuscolo; i byte vivono UNA volta sola in
// <workspace>/<docId>.opendesigner/assets/ e si servono via GET /assets-api/{docId}/{hash}.
//
// È il punto dell'indirizzamento per contenuto: un CreateNode con dentro
// un'immagine porterebbe quei byte nell'op-log, cioè in un file append-only che
// non si compatta mai per intero -- la stessa foto trascinata dieci volte
// pesherebbe dieci volte, e ogni catch-up di Subscribe la rimanderebbe sul filo.
// Con l'hash l'op resta di poche decine di byte e i pixel non entrano mai nel
// giro degli op.
message ImageNode { string asset_hash = 1; }

// Un punto d'ancoraggio di un path vettoriale.
//
// DUE SPAZI, ed è la regola più importante di tutto il messaggio -- il renderer,
// l'hit-test e il pen tool devono leggerla nello stesso identico modo, in Go e
// in TypeScript (web/src/store/vectorGeometry.ts è l'unica implementazione).
//
// 1. `x`/`y` sono in coordinate LOCALI AL NODO: l'origine è (Node.x, Node.y),
//    quindi il punto in coordinate mondo è (Node.x + x, Node.y + y).
//    NON in coordinate mondo, e non è un capriccio: ogni consumatore esistente
//    lavora sul box del nodo -- selectTool manda un setProps{x,y} per
//    trascinare, l'overlay disegna la selezione da x/y/width/height, il
//    renderer scarta un nodo con width/height <= 0. Con ancoraggi in coordinate
//    mondo, trascinare un nodo vettoriale sposterebbe il box e lascerebbe il
//    path dov'era, a meno di riscrivere TUTTA la geometria a ogni spostamento
//    (una regola in più che nessuno applica). Locali, la geometria viaggia col
//    nodo gratis -- e sarà così anche quando la traccia 1 renderà le coordinate
//    relative al parent: un vettoriale dentro un gruppo si sposterà col gruppo
//    senza una riga in più.
//
// 2. `in_`/`out_` sono OFFSET RELATIVI ALL'ANCORAGGIO (non punti): il punto di
//    controllo della curva che ENTRA nell'ancoraggio è (x + in_x, y + in_y),
//    quello della curva che ne ESCE è (x + out_x, y + out_y).
//    Relativi perché così -- e SOLO così -- il default di proto3 dice il vero:
//    (0,0) è la maniglia COINCIDENTE con l'ancoraggio, cioè "nessuna maniglia,
//    il segmento è una retta". Con maniglie assolute un ancoraggio decodificato
//    senza in_/out_ avrebbe le maniglie nell'ORIGINE del nodo, cioè una curva
//    che ci va a sbattere: il caso più comune di tutti (un punto d'angolo)
//    sarebbe l'unico non rappresentabile allo zero, e ogni scrittore dovrebbe
//    ricordarsi di riempire i sei campi anche quando non servono.
//    È anche la ragione per cui la maggior parte dei formati le tiene relative.
//    Il prezzo -- una somma nel renderer -- lo paga un solo posto
//    (vectorGeometry.ts), e per giunta gratis: bezierCurveTo con entrambi i
//    controlli coincidenti agli estremi disegna esattamente la retta, quindi il
//    caso "nessuna maniglia" non ha nemmeno bisogno di un ramo.
message Anchor {
  double x = 1; double y = 2;
  double in_x = 3; double in_y = 4;
  double out_x = 5; double out_y = 6;
}

// Un contorno: una sequenza di ancoraggi, chiusa o aperta. `closed` è dato e
// non derivato (primo ancoraggio == ultimo): un path chiuso si riempie e si
// hit-testa sul riempimento, uno aperto sulla prossimità alla linea.
message SubPath { repeated Anchor anchors = 1; bool closed = 2; }

// Più subpath per nodo: un contorno esterno e i suoi buchi (o più contorni
// scollegati) sono UN oggetto per l'utente, quindi un nodo solo.
//
// IL BOX. Node.x/y/width/height restano quello che sono per rect ed ellipse: il
// box del nodo. Non sono derivati dalla geometria da chi applica l'op -- né
// core.Apply né applyOp li ricalcolano -- perché la bbox di una cubica non è
// una copia di due righe e due implementazioni "identiche" di quella
// matematica divergerebbero al primo caso limite, proprio sull'invariante che
// questa traccia esiste per difendere.
//
// L'invariante è quindi del SCRITTORE, e vale la pena scriverla per esteso:
// dopo un SetVectorPath, la bbox locale della geometria è (0,0)-(width,height).
// Cioè: chi riscrive i subpath normalizza (trasla gli ancoraggi in modo che il
// minimo sia (0,0)) e manda nello STESSO GESTO il SetProperties che aggiorna
// x/y/width/height. Così un nodo vettoriale è indistinguibile da un rettangolo
// per tutto il resto dell'editor: la selezione lo circonda, il resize ha un box
// su cui lavorare, e il pen tool è l'unico posto che conosce la regola.
// web/src/store/vectorGeometry.ts::vectorBounds è l'unica implementazione della
// bbox, così "scritto due volte" non è nemmeno possibile. Ed è la bbox VERA
// della curva (derivata risolta per asse, e solo sui segmenti effettivamente
// disegnati), non l'inviluppo dei punti di controllo: su quest'ultimo il box
// dichiarato qui sarebbe un sovrainsieme -- fino a un 33% di vuoto su una sola
// cubica -- e a pagarlo sarebbe la SELEZIONE, con maniglie di resize che non
// toccano il path e un marquee che afferra senza sfiorare l'inchiostro.
//
// Vale nei DUE VERSI, ed è il secondo a costare qualcosa: nemmeno il BOX può
// cambiare senza che la geometria lo segua, altrimenti un drag delle 8 maniglie
// di resize (che è un solo SetProperties{x,y,width,height}) violerebbe
// l'invariante senza nessun SetVectorPath in vista -- box cresciuto, inchiostro
// della misura di prima. Chi ridimensiona un nodo vettoriale riscrive quindi gli
// ancoraggi con la stessa trasformazione, NELLO STESSO GESTO
// (web/src/store/vectorGeometry.ts::resizeVector, emesso da
// web/src/tools/selectTool.ts). Gli ancoraggi restano lunghezze in coordinate
// locali e NON frazioni 0..1 del box: normalizzati sarebbero indefiniti per ogni
// path con un asse degenere (un segmento orizzontale: divisione per zero) e
// costringerebbero il pen tool a rinormalizzare tutta la geometria a ogni punto
// aggiunto.
//
// Un asse DEGENERE è uno stato legittimo e il box non lo falsa: un path di un
// solo ancoraggio ha width e height 0, un segmento orizzontale ha height 0. Il
// click non passa dal box (colpisce l'inchiostro,
// web/src/renderer/shapes.ts::hitTestNode), e chi ci deve far passare sopra un
// MARQUEE allarga per conto suo
// (web/src/renderer/shapes.ts::selectionBoundsOfNode) -- quella è una tolleranza
// di selezione, non un fatto sulla geometria.
message VectorNode { repeated SubPath subpaths = 1; }

// M4 — un COMPONENTE è un sottoalbero MASTER che vive in `nodes` come qualunque
// altro (si vede e si modifica sul canvas). Document.components lo indicizza per
// id; il valore punta al nodo radice del master e porta un nome. Un'ISTANZA
// (InstanceNode) lo rende VIRTUALMENTE alla propria trasformazione, quindi la
// propagazione master->istanze è gratis: le istanze leggono il master vivo.
message Component {
  string root_node_id = 1; // radice del master, dentro Document.nodes
  string name = 2;
}

// Un override per-istanza su UN nodo del master. Minimo (design M4): fill e
// testo. I flag *_present distinguono "non sovrascritto" da "sovrascritto a
// vuoto", come SetText.style_present: senza, un override di solo testo
// azzererebbe il fill ereditato dal master.
message InstanceOverride {
  string master_node_id = 1;
  repeated Paint fills = 2;
  bool fills_present = 3;
  string text = 4;
  bool text_present = 5;
}

// shape 37: un'istanza di un componente. Rende il sottoalbero master di
// `component_id` alla trasformazione del Node (x/y), con gli override applicati
// per nodo del master. I figli dell'istanza NON stanno in `nodes`: sono
// derivati dal master a ogni lettura (renderer, hit-test, bounds).
message InstanceNode {
  string component_id = 1;
  repeated InstanceOverride overrides = 2;
}

message Node {
  string id = 1;
  string parent_id = 2;   // id nodo container OPPURE id Page (per i root)
  string order_key = 3;   // fractional index
  string name = 4;
  bool visible = 5;
  double opacity = 6;     // 0..1
  double x = 10; double y = 11; double width = 12; double height = 13; double rotation = 14;
  repeated Paint fills = 20;
  // Il numero 21 era RISERVATO dal design fin dall'inizio e ora è implementato
  // (traccia 2). Ripetuto come `fills`, e con la stessa semantica di scrittura:
  // la mask "strokes" SOSTITUISCE l'intera lista, non ne fonde gli elementi.
  repeated Stroke strokes = 21;
  // Effetti (ombre, sfocatura). Ripetuto come `fills`: la mask "effects"
  // SOSTITUISCE l'intera lista. Il renderer oggi disegna la PRIMA ombra e la
  // PRIMA sfocatura di un nodo: il canvas 2D ha un solo stato di ombra.
  repeated Effect effects = 22;
  oneof shape {
    RectNode rect = 30;
    EllipseNode ellipse = 31;
    TextNode text = 32;
    // Numeri assegnati in anticipo alle quattro tracce parallele. Ogni traccia
    // sostituisce SOLO la propria riga con la dichiarazione vera (e definisce il
    // messaggio corrispondente): righe distinte si fondono senza conflitti.
    GroupNode group = 33;   // traccia 1 — annidamento (vedi GroupNode sopra)
    FrameNode frame = 34;   // traccia 1 — annidamento (vedi FrameNode sopra)
    ImageNode image = 35;   // traccia 3 — periferia (vedi ImageNode sopra)
    VectorNode vector = 36; // traccia 4 — vettoriale (vedi VectorNode sopra)
    InstanceNode instance = 37; // M4 — istanza di un componente (vedi InstanceNode sopra)
  }
  // Metadati liberi chiave -> valore: il ponte fra il disegno e il prodotto.
  // Convenzioni (non imposte dal modello, lette dagli strumenti dei flussi):
  //   "flow.kind"       screen | decision | action | start | end | note
  //   "code.route"      la rotta dell'app che realizza questa schermata
  //   "code.component"  il componente del codice che la realizza
  //   "test.id"         il data-testid con cui un test trova questo elemento
  //   "test.text"       il testo accessibile con cui lo trova
  //   "status"          planned | implemented | tested
  // La mask "meta" SOSTITUISCE l'intera mappa, come `fills` per le liste.
  map<string, string> meta = 40;
}

message Page { string id = 1; string name = 2; }

// ---------- flussi ----------
// Un FLUSSO è un percorso dell'utente attraverso le schermate: un insieme di
// TRANSIZIONI (archi) fra nodi del disegno. Le schermate NON sono copie: sono i
// frame del documento, referenziati per id, quindi il flusso resta agganciato al
// disegno vero -- spostare o rinominare una schermata non lo rompe, cancellarla
// cancella i suoi archi (vedi core.applyDelete).
message Flow {
  string id = 1;
  string name = 2;
  string description = 3;
  // Schermata di ingresso (id di un nodo) oppure vuoto.
  string start_id = 4;
}

message Transition {
  string id = 1;
  string flow_id = 2;
  string from_id = 3;
  string to_id = 4;
  string label = 5;
  // Cosa la innesca: "click" | "submit" | "auto" | "key" | "back" | testo libero.
  string trigger = 6;
  // Opzionale: il nodo DENTRO from_id che la innesca (l'hotspot cliccabile).
  string element_id = 7;
  // Condizione per cui l'arco è percorribile, e ciò che l'arco cambia. Testo
  // libero: li leggono le persone, gli agenti e il prototipo giocabile
  // ("cart non vuoto" / "cart=empty").
  string guard = 8;
  string effect = 9;
}

message Document {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  repeated Page pages = 4;
  map<string, Node> nodes = 5;
  // M4 — componenti: componentId -> master (nodo radice in `nodes` + nome).
  map<string, Component> components = 6;
  map<string, Flow> flows = 7;
  map<string, Transition> transitions = 8;
}

// ---------- op ----------
message CreateNode { Node node = 1; }
message DeleteNode { string id = 1; }
message SetProperties {
  string id = 1;
  Node patch = 2;
  google.protobuf.FieldMask mask = 3; // path dot su Node, es. "x","y","fills"
}
// Op dedicato invece di un path della mask di SetProperties: il contenuto del
// testo vive DENTRO il oneof `shape`, mentre la mask di SetProperties indirizza
// campi di primo livello del Node. Un path annidato ("text.content") costringerebbe
// entrambe le implementazioni di apply a un parser di path.
//
// `style_present` distingue "non specificato" da "azzera": in proto3 un
// sotto-messaggio assente e uno con tutti i campi a zero sono indistinguibili
// dopo il round-trip protojson, quindi senza il flag un SetText di solo
// contenuto azzererebbe lo stile del nodo. style_present=false => lascia stare
// lo stile esistente; true => sostituiscilo con `style` (anche se vuoto).
message SetText {
  string id = 1;
  string content = 2;
  TextStyle style = 3;
  bool style_present = 4;
}
// Sostituisce IN BLOCCO i subpath di un VectorNode. Op dedicato invece di un
// path della mask di SetProperties per la stessa ragione di SetText: la
// geometria vive DENTRO il oneof `shape`, mentre la mask indirizza campi di
// primo livello del Node.
//
// La sostituzione è wholesale e non incrementale (nessun "sposta l'ancoraggio
// i-esimo"): un gesto della penna può aggiungere, spostare e cancellare
// ancoraggi tutti insieme, e un op per micro-modifica moltiplicherebbe i casi
// da tenere identici fra Go e TS senza aggiungere nulla -- l'inverso è
// comunque i subpath PRECEDENTI per intero.
//
// Una lista VUOTA è legittima e non è "non specificato": è il path che l'utente
// ha svuotato. Nessun flag `present` serve qui (a differenza di
// SetText.style_present) perché non esiste nessun altro campo dell'op che
// possa restare intatto: l'op È i subpath.
message SetVectorPath {
  string id = 1;
  repeated SubPath subpaths = 2;
}

// Sposta un nodo sotto un altro container (o direttamente sotto una Page) e ne
// riscrive l'ordine fra i nuovi pari.
//
// Op dedicato e non un path della mask di SetProperties -- a differenza di
// `order_key`, che è un campo come gli altri -- perché la riparentazione ha una
// VALIDAZIONE propria che nessun altro campo ha: il nuovo parent deve esistere
// (nodo o pagina) e non può essere il nodo stesso né un suo discendente,
// altrimenti il sottoalbero si stacca dal documento e diventa un ciclo
// irraggiungibile. Una mask che scrivesse `parent_id` costringerebbe
// applySetProps (e la sua gemella TS) a portarsi dentro l'attraversamento
// dell'albero solo per un path.
//
// `order_key` viaggia INSIEME: cambiare parent senza riordinare lascerebbe il
// nodo con la chiave calcolata fra i pari VECCHI, cioè in una posizione
// arbitraria fra i nuovi. Un solo op, una sola posizione finale.
message ReparentNode {
  string id = 1;
  string new_parent_id = 2; // id nodo container OPPURE id Page
  string order_key = 3;     // fractional index fra i nuovi pari
}
// ---------- pagine ----------
// Le pagine sono i container RADICE del documento: ogni nodo pende da una di
// loro (Node.parent_id accetta un id di nodo OPPURE di Page) e il canvas ne
// mostra una alla volta. `Document.pages` esisteva da M0 con una pagina sola e
// nessun op capace di toccarla; questi tre la rendono un documento a più
// pagine.
//
// Tre op dedicati e non dei path della mask di SetProperties: la mask indirizza
// campi di un NODE (è il suo id a viaggiare in SetProperties.id) e una pagina
// non è un nodo -- non ha geometria, non ha forma, non ha parent. Un
// "SetProperties su una pagina" costringerebbe entrambe le implementazioni di
// apply a due tabelle di path disgiunte sotto lo stesso op.
message CreatePage { Page page = 1; }
// Cancella la pagina E TUTTI i nodi che ci pendono, a cascata (stessa regola di
// DeleteNode: ciò che non è più raggiungibile da una pagina non fa più parte
// del documento). Rifiutata sull'ULTIMA pagina rimasta: un documento senza
// pagine non ha nessun posto in cui creare un nodo.
message DeletePage { string id = 1; }
message RenamePage { string id = 1; string name = 2; }

// op 16 (M4): registra un sottoalbero ESISTENTE (radice root_node_id) come
// master di un componente. Non copia nulla: il master resta dov'è in `nodes`, e
// da qui in poi le istanze lo referenziano per component_id.
message CreateComponent {
  string component_id = 1;
  string root_node_id = 2;
  string name = 3;
}

// op 20 (M4): imposta (o azzera) l'override di un'istanza su un nodo del master.
// L'override sostituito è quello con lo stesso master_node_id; un override con
// entrambi i *_present a false lo RIMUOVE (torna a ereditare dal master).
message SetInstanceOverride {
  string instance_id = 1;
  InstanceOverride override = 2;
}
// Flussi: upsert ASSOLUTI (il valore che arriva è il valore finale), come i
// campi di SetProperties. Un id nuovo crea, un id esistente sostituisce.
message SetFlow { Flow flow = 1; }
// Cancella il flusso E tutte le sue transizioni.
message DeleteFlow { string id = 1; }
message SetTransition { Transition transition = 1; }
message DeleteTransition { string id = 1; }

message Op {
  string op_id = 1;
  string doc_id = 2;
  oneof kind {
    CreateNode    create_node = 10;
    SetProperties set_props   = 11;
    DeleteNode    delete_node = 12;
    SetText       set_text    = 13;
    ReparentNode  reparent_node = 14; // traccia 1 — sposta un nodo sotto un altro parent
    // Pagine multiple (traccia 1). Numeri PRESI DOPO quelli già assegnati alle
    // altre tracce (15 e 16 qui sotto): le righe restano distinte e i merge
    // puliti, esattamente come per il oneof `shape`.
    CreatePage    create_page   = 17;
    DeletePage    delete_page   = 18;
    RenamePage    rename_page   = 19;
    SetVectorPath set_vector_path = 15; // traccia 4 — sostituisce i subpath di un VectorNode
    CreateComponent     create_component      = 16; // M4 — registra un sottoalbero come master
    SetInstanceOverride set_instance_override = 20; // M4 — override fill/testo su un'istanza
    SetFlow          set_flow          = 21; // flussi — upsert di un flusso
    DeleteFlow       delete_flow       = 22;
    SetTransition    set_transition    = 23; // flussi — upsert di un arco
    DeleteTransition delete_transition = 24;
  }
}
message OpRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string client_id = 3;
  Op op = 4;
}

// ---------- servizio ----------
message OpenRequest  { string doc_id = 1; }
message OpenResponse { Document snapshot = 1; uint64 seq = 2; }
message CreateDocumentRequest { string name = 1; }
// updated_at (secondi unix, 0 = ignoto), screens (frame di primo livello) e
// flows sono per la Home: la card di un documento li mostra senza aprirlo.
message DocInfo { string id = 1; string name = 2; int64 updated_at = 3; uint32 screens = 4; uint32 flows = 5; }
message RenameDocumentRequest { string doc_id = 1; string name = 2; }
message DeleteDocumentRequest { string doc_id = 1; }
message DeleteDocumentResponse {}
message ListDocumentsRequest {}
message ListDocumentsResponse { repeated DocInfo docs = 1; }

// Il canale live è diviso in due RPC invece di uno stream bidirezionale: il
// `fetch` dei browser non supporta i request body in streaming, quindi un bidi
// non è raggiungibile dall'editor. Un unary in salita + un server-stream in
// discesa danno la stessa semantica e funzionano ovunque.
message SubmitOpRequest  { string doc_id = 1; string client_id = 2; Op op = 3; }
message SubmitOpResponse { Ack ack = 1; }

message SubscribeRequest { string doc_id = 1; string client_id = 2; uint64 since_seq = 3; }

message Ack      { string op_id = 1; uint64 seq = 2; }
message ErrorMsg { string op_id = 1; string message = 2; }
message ServerMsg { oneof kind { OpRecord applied = 1; Ack ack = 2; ErrorMsg error = 3; } }

// ---------- presenza (effimera, NON passa dall'op-log) ----------
//
// Chi sta guardando il documento, dove ha il cursore e cosa ha selezionato.
// Vive solo in memoria nell'hub del documento e sparisce quando lo stream
// WatchPresence del client si chiude: niente account, niente persistenza -- il
// nickname lo sceglie il client e vale per la sessione.
//
// Il cursore è in coordinate MONDO, così ognuno lo vede al punto giusto
// qualunque sia la propria camera.
message PresenceState {
  string client_id = 1;
  string nickname = 2;
  bool has_cursor = 3;
  double cursor_x = 4;
  double cursor_y = 5;
  string page_id = 6;
  repeated string selection = 7;
}
message PresenceEvent {
  oneof kind {
    PresenceState update = 1;   // un peer è entrato o è cambiato
    string left_client_id = 2;  // un peer se n'è andato
  }
}
// ---------- analisi dei flussi ----------
message FlowIssue {
  // no_start | unreachable | dead_end | no_exit | ambiguous | empty
  string kind = 1;
  string flow_id = 2;
  string node_id = 3;        // la schermata coinvolta, se una
  string transition_id = 4;  // l'arco coinvolto, se uno
  string message = 5;        // testo leggibile (italiano)
}
// Un percorso: dalla schermata di ingresso a una schermata finale (senza uscite)
// o a un ritorno su una già visitata. Sequenza di transizioni.
message FlowPath {
  repeated string transition_ids = 1;
  repeated string node_ids = 2;  // node_ids[i] -> node_ids[i+1] via transition_ids[i]
  bool loops = 3;                // finisce tornando su una schermata già nel percorso
}
message FlowReport {
  string flow_id = 1;
  uint32 screens = 2;
  uint32 transitions = 3;
  repeated FlowIssue issues = 4;
  repeated FlowPath paths = 5;
  bool paths_truncated = 6;  // il tetto sul numero di percorsi è stato raggiunto
}
// flow_id vuoto = tutti i flussi del documento.
message AnalyzeFlowsRequest { string doc_id = 1; string flow_id = 2; }
message AnalyzeFlowsResponse { repeated FlowReport reports = 1; }

// ---------- export di codice ----------
// Un file del progetto generato: percorso relativo (con "/") e byte.
message ExportFile {
  string path = 1;
  bytes content = 2;
}
// target: "react" (default: Vite + React + TypeScript + Tailwind v4 + test
// Playwright dei flussi) oppure "html" (un file per schermata). flow_id vuoto =
// cabla e testa tutti i flussi.
message ExportCodeRequest {
  string doc_id = 1;
  string target = 2;
  string flow_id = 3;
}
message ExportCodeResponse {
  repeated ExportFile files = 1;
  // Approssimazioni e omissioni (asset mancanti, transizioni verso nodi non
  // esportati): testo leggibile (italiano).
  repeated string warnings = 2;
}

message WatchPresenceRequest { string doc_id = 1; string client_id = 2; string nickname = 3; }
message UpdatePresenceRequest { string doc_id = 1; PresenceState state = 2; }
message UpdatePresenceResponse {}

service DocumentService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (DocInfo);
  // Rinomina un documento (meta.json + nome in memoria dell'hub).
  rpc RenameDocument(RenameDocumentRequest) returns (DocInfo);
  // Elimina un documento SPOSTANDO il bundle in <workspace>/.trash (mai rm -rf).
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc OpenDocument(OpenRequest) returns (OpenResponse);
  // Invia un'operazione. Il broadcast a tutti i client passa da Subscribe.
  rpc SubmitOp(SubmitOpRequest) returns (SubmitOpResponse);
  // Stream degli OpRecord applicati: catch-up da since_seq, poi live.
  rpc Subscribe(SubscribeRequest) returns (stream ServerMsg);
  // Presenza: lo stream manda prima l'elenco di chi c'è già, poi gli
  // aggiornamenti. Chiuderlo = uscire dal documento.
  rpc WatchPresence(WatchPresenceRequest) returns (stream PresenceEvent);
  // Aggiorna cursore/selezione del client (che deve avere uno stream aperto).
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
  // Analisi dei flussi (grafo delle schermate): schermate irraggiungibili,
  // vicoli ciechi, percorsi. Calcolata dal server (internal/flow), così UI,
  // CLI e agenti MCP vedono lo stesso risultato.
  rpc AnalyzeFlows(AnalyzeFlowsRequest) returns (AnalyzeFlowsResponse);
  // Esporta il design come codice (internal/codegen): l'elenco dei file del
  // progetto generato, calcolato dallo snapshot corrente. Come per
  // AnalyzeFlows, CLI, MCP ed editor vedono lo stesso risultato.
  rpc ExportCode(ExportCodeRequest) returns (ExportCodeResponse);
}
