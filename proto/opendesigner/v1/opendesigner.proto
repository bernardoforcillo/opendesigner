syntax = "proto3";
package opendesigner.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/bernardoforcillo/opendesigner/gen/opendesigner/v1;opendesignerv1";

// ---------- document / scene graph ----------
message Color { float r = 1; float g = 2; float b = 3; float a = 4; } // 0..1
message SolidPaint { Color color = 1; }
// A color stop of a gradient. `position` is in 0..1 along the gradient axis;
// the writer keeps stops in ascending position order (the canvas and the SVG
// read them in the given order).
// `variable_id`, when set, binds the stop to a COLOR variable: `color` is then
// the value last resolved for it (the server and the clients keep it in sync
// with the variable, like a plain fill), and a missing variable keeps it.
message GradientStop { Color color = 1; double position = 2; string variable_id = 3; }

// A gradient is defined in NORMALIZED coordinates of the node's box: (0,0) is
// the top-left corner, (1,1) the bottom-right. This way it stays valid when the
// node is resized, without rewriting any op.
//
// LINEAR: the axis goes from (x1,y1) to (x2,y2).
// RADIAL: the center is (x1,y1) and the radius is the distance between (x1,y1)
// and (x2,y2), measured in WORLD coordinates after denormalization (a circle,
// not an ellipse).
// ANGULAR (conic): the center is (x1,y1); the 0% direction points from it toward (x2,y2) and the
// stops sweep clockwise once around (360 degrees). Only the direction of (x1,y1)->(x2,y2) matters.
// DIAMOND: the center is (x1,y1); the 100% stop sits where |dx|+|dy| (in WORLD units) equals the
// distance between (x1,y1) and (x2,y2), so the bands are axis-aligned diamonds.
message GradientPaint {
  repeated GradientStop stops = 1;
  double x1 = 2; double y1 = 3; double x2 = 4; double y2 = 5;
}
// An image as a paint: `asset_hash` is a file already in the document's asset store (the same
// content-addressed files image nodes use). FILL covers the shape and crops, FIT shows the whole
// image inside it, TILE repeats it at its natural size.
enum ImageScaleMode {
  IMAGE_SCALE_MODE_UNSPECIFIED = 0;  // FILL
  IMAGE_SCALE_MODE_FIT = 1;
  IMAGE_SCALE_MODE_TILE = 2;
}
message ImagePaint { string asset_hash = 1; ImageScaleMode mode = 2; }
// A MESH gradient: a rows x cols grid of colors spread over the node's box (row-major, the first
// color at the top-left corner, the last at the bottom-right), blended smoothly (bilinear) between
// the grid points. The points sit on a regular grid; they do not move.
message MeshPaint { uint32 rows = 1; uint32 cols = 2; repeated Color colors = 3; }
message Paint { oneof kind { SolidPaint solid = 1; GradientPaint linear = 2; GradientPaint radial = 3; ImagePaint image = 4; MeshPaint mesh = 5;
  // Fields 20-29 are the shapes-and-paints track's (both reuse GradientPaint's stops).
  GradientPaint angular = 20; GradientPaint diamond = 21; } }

// Alignment of the stroke relative to the shape's PERIMETER. CENTER is the
// drawing default (half inside, half outside): it is the only one the 2D canvas
// can do on its own, the other two are obtained by doubling the width and
// clipping away the side that is not needed (see
// web/src/renderer/canvasRenderer.ts).
//
// UNSPECIFIED = 0 as in TextAlign, and for the same reason: in proto3 zero is
// indistinguishable from "field absent", so the value 0 cannot be a real user
// choice -- it collapses to CENTER at the renderer boundary, where all the
// defaults live (web/src/store/types.ts::toStrokeLite).
enum StrokeAlign {
  STROKE_ALIGN_UNSPECIFIED = 0;
  STROKE_ALIGN_CENTER = 1;
  STROKE_ALIGN_INSIDE = 2;
  STROKE_ALIGN_OUTSIDE = 3;
}

// Arrowheads at the two ends of an OPEN path or a line (a vector's open subpaths; closed shapes
// have no ends). NONE (0) is a plain butt/round/square end as the stroke style says. The head is drawn
// scaled by the stroke weight (see docs/shapes.md).
enum ArrowHead {
  ARROW_HEAD_NONE = 0;
  ARROW_HEAD_ARROW = 1;     // two strokes forming an open "V"
  ARROW_HEAD_TRIANGLE = 2;  // a filled triangle
  ARROW_HEAD_CIRCLE = 3;
  ARROW_HEAD_SQUARE = 4;
  ARROW_HEAD_DIAMOND = 5;
}
// Per-side stroke weights of a rectangle or frame (world units, each >= 0). When present they
// REPLACE `Stroke.weight` on the four sides, so a border can be thick at the bottom only.
message StrokeSides { double top = 1; double right = 2; double bottom = 3; double left = 4; }

// A stroke: the same Paint as fills, plus the width (in WORLD coordinates, like
// font_size) and the alignment. A message of its own rather than three parallel
// fields on Node, because `strokes` is repeated exactly like `fills`: a node can
// have several overlapping strokes, and each has its OWN weight.
message Stroke {
  Paint paint = 1;
  double weight = 2;      // >= 0, in world coordinates
  StrokeAlign align = 3;
  // Fields 20-29 are the shapes-and-paints track's.
  ArrowHead start_cap = 20;   // the first anchor of the first open subpath
  ArrowHead end_cap = 21;     // the last anchor of the last open subpath
  StrokeSides sides = 22;     // per-side weights (rect / frame); absent = `weight` on every side
  // Fields 30-49 are the vector track's.
  // VARIABLE WIDTH (vectors): the width along the path, as points sorted by position. Empty = the uniform
  // stroke. Between points the widths are interpolated linearly; before the first and after the last
  // they stay. See WidthPoint.
  repeated WidthPoint width_profile = 30;
  // Field 40-49 are the brushes track's.
  // BRUSH (vectors): the stroke is drawn as a row of tips stamped along the path instead of a line. Absent
  // (or kind NONE) = the plain stroke. A brush wins over width_profile and dashes. See Brush.
  Brush brush = 40;
}

enum BrushKind {
  BRUSH_KIND_NONE = 0;
  BRUSH_KIND_STRETCH = 1;  // tiles of one tip laid end to end, each `spacing` weights long and one weight wide
  BRUSH_KIND_SCATTER = 2;  // tips of one weight stamped every `spacing` weights, jittered
}

enum BrushTip {
  BRUSH_TIP_DOT = 0;
  BRUSH_TIP_DASH = 1;     // a rounded bar, twice as long as wide
  BRUSH_TIP_SQUARE = 2;
  BRUSH_TIP_DIAMOND = 3;
  BRUSH_TIP_LEAF = 4;
}

// A brush: repeated shapes along the path, placed by arc length and jittered by a seeded RNG, so the same
// document draws the same marks on every client and in the SVG export. Distances are MULTIPLES of the stroke
// weight, so changing the weight scales the whole brush.
message Brush {
  BrushKind kind = 1;
  BrushTip tip = 2;
  double spacing = 3;      // 0.05..64: the distance between stamps (stretch: the length of one tile)
  double scatter = 4;      // 0..8: how far a stamp may stray across the path (a total spread, in weights)
  double size_jitter = 5;  // 0..1: random scale of a stamp, 1 = between half and one and a half
  double angle_jitter = 6; // 0..180: random turn of a stamp in degrees, either way
  uint32 seed = 7;         // seeds the jitter
}

// One point of a variable-width stroke. `position` runs 0..1 along each subpath's length. `left` and
// `right` are the half-widths on the left and right of the direction of travel, as MULTIPLES of
// half the stroke weight (1 / 1 = the uniform stroke; 0 / 0 = a point), so changing the weight scales
// the whole profile.
message WidthPoint {
  double position = 1; // 0..1
  double left = 2;     // 0..16
  double right = 3;    // 0..16
}

// Drop shadow. Offset and blur are in WORLD coordinates (like font_size): they
// grow with the node and with zoom. `blur` is the radius as the 2D canvas
// understands it (shadowBlur): the standard deviation of the gaussian is half
// of it.
message DropShadow {
  Color color = 1;
  double offset_x = 2;
  double offset_y = 3;
  double blur = 4;       // >= 0
}
// Layer blur: blurs the node itself. `radius` is the standard deviation of the
// gaussian, in world coordinates.
message LayerBlur { double radius = 1; } // >= 0
// Inner shadow: the shadow of everything OUTSIDE the shape, cast inward and
// clipped to the shape. Same units as DropShadow. Drawn on rectangles,
// ellipses and frames (the shapes that have an outline path).
message InnerShadow {
  Color color = 1;
  double offset_x = 2;
  double offset_y = 3;
  double blur = 4;       // >= 0
}
// Background blur: blurs what is BEHIND the node, inside its outline (the
// frosted-glass look). `radius` is the standard deviation, in world coordinates.
message BackgroundBlur { double radius = 1; } // >= 0
// Progressive blur: the radius ramps linearly from start_radius at (x1, y1) to
// end_radius at (x2, y2), points in the node's unit box (0..1 across and down, like a
// gradient's handles); before the start and past the end it stays. `background` false
// blurs the node itself, true what is behind it (inside the outline, like BackgroundBlur).
message ProgressiveBlur {
  double start_radius = 1; // >= 0, standard deviation in world units
  double end_radius = 2;   // >= 0
  double x1 = 3;
  double y1 = 4;
  double x2 = 5;
  double y2 = 6;
  bool background = 7;
}

enum NoiseMode {
  NOISE_MODE_UNSPECIFIED = 0; // MONO
  NOISE_MODE_MONO = 1;        // grey grains
  NOISE_MODE_DUO = 2;         // grains of `color` and `color2`
  NOISE_MODE_MULTI = 3;       // grains of random colours
}

// Film grain drawn over the node, inside its outline (its box for other shapes).
message Noise {
  NoiseMode mode = 1;
  double size = 2;    // grain size in world units, > 0 (0 => 1)
  double density = 3; // 0..1, share of the grains that show
  double opacity = 4; // 0..1
  Color color = 5;    // DUO: first colour (MONO and MULTI ignore it)
  Color color2 = 6;   // DUO: second colour
  uint32 seed = 7;
}

// A soft mottled relief (paper, plaster) drawn over the node, light and dark in turn.
message Texture {
  double scale = 1;     // blob size in world units, > 0 (0 => 8)
  double intensity = 2; // 0..1
  uint32 seed = 3;
}

// Simplified glass: a frosted backdrop (background blur), a fine grain and a light
// edge on the side facing `light_angle`. Drawn as those three effects.
message Glass {
  double frost = 1;       // >= 0, background blur radius in world units
  double light = 2;       // 0..1, strength of the light edge
  double light_angle = 3; // degrees, where the light comes from: 0 = the left, 90 = the top (y grows down)
  double noise = 4;       // 0..1, strength of the grain
}

message Effect {
  oneof kind {
    DropShadow drop_shadow = 1;
    LayerBlur layer_blur = 2;
    InnerShadow inner_shadow = 3;
    BackgroundBlur background_blur = 4;
    // 20..29 are the type-and-effects range.
    ProgressiveBlur progressive_blur = 20;
    Noise noise = 21;
    Texture texture = 22;
    Glass glass = 23;
  }
}

// How a node's pixels combine with what is behind it. UNSPECIFIED is NORMAL.
enum BlendMode {
  BLEND_MODE_UNSPECIFIED = 0;
  BLEND_MODE_MULTIPLY = 1;
  BLEND_MODE_SCREEN = 2;
  BLEND_MODE_OVERLAY = 3;
  BLEND_MODE_DARKEN = 4;
  BLEND_MODE_LIGHTEN = 5;
  BLEND_MODE_COLOR_DODGE = 6;
  BLEND_MODE_COLOR_BURN = 7;
  BLEND_MODE_HARD_LIGHT = 8;
  BLEND_MODE_SOFT_LIGHT = 9;
  BLEND_MODE_DIFFERENCE = 10;
  BLEND_MODE_EXCLUSION = 11;
  BLEND_MODE_HUE = 12;
  BLEND_MODE_SATURATION = 13;
  BLEND_MODE_COLOR = 14;
  BLEND_MODE_LUMINOSITY = 15;
}

// Independent corner radii (world units, each >= 0, clamped so neighbours fit the side).
message CornerRadii { double top_left = 1; double top_right = 2; double bottom_right = 3; double bottom_left = 4; }
message RectNode {
  double corner_radius = 1;
  // Fields 20-29 are the shapes-and-paints track's.
  // Corner smoothing ("squircle"): 0 = circular arcs, 1 = fully smoothed (the iOS-style continuous
  // curve). Written by the "corner_smoothing" mask path.
  double corner_smoothing = 20;
  // When present, the four radii replace `corner_radius`. Written by the "corner_radii" mask path.
  CornerRadii radii = 21;
}
// cx/cy/rx/ry derive from x/y/width/height, as for RectNode. The arc fields turn the ellipse into
// an ARC / PIE / RING (written by the "arc" mask path); all zero is the plain full ellipse.
message EllipseNode {
  double arc_start = 1;    // degrees, 0 = the +x side (3 o'clock), growing clockwise
  double arc_sweep = 2;    // degrees in -360..360; 0 (unset) and +-360 are the full ellipse
  double inner_ratio = 3;  // 0..1: the hole's radius as a fraction of the outer one (a ring/donut); 0 = none
}
// A regular polygon inscribed in the node's box (the first vertex at the top).
message PolygonNode { uint32 sides = 1; }   // 3..60
// A star: `points` outer vertices on the box's ellipse, with inner vertices at `inner_ratio` of the radius.
message StarNode { uint32 points = 1; double inner_ratio = 2; }   // points 3..60, ratio 0.05..0.95

// A GROUP is a container WITHOUT clipping and without geometry of its own: its
// bounds are the UNION of its children's (derived, not stored) and it has
// nothing to fill -- it is not drawn and not hit, its children are.
//
// The message is therefore empty, and that is not a defect: what makes a node a
// group is its POSITION in the tree (the children) plus the oneof case, which
// tells the renderer, hit-test and selection policy how to treat it. A
// FrameNode (34) instead has fields of its own (clips_content) and bounds of
// its own.
//
// x/y remain meaningful: they are the TRANSLATION the group contributes to its
// children (see web/src/canvas/transform.ts::localTransformOf) -- they are 0 at
// creation, so grouping moves nothing, and they change when the group is
// dragged. width/height are not used by anyone: the bounds are the union of the
// children.
message GroupNode {}

// A FRAME is the complementary opposite of the group: a container WITH
// geometry of its own. Its box (x/y/width/height of the Node) is not derived
// from the children -- it is drawn, filled and hit like any shape -- and it is
// the artboard: the surface you compose on, not just a logical grouping.
//
// Everything else follows from this:
//   - it is drawn (unlike a group) and hit on its own box, so clicking the
//     empty part of a frame selects the frame;
//   - its bounds are its own, never the union of the children (store/groups.ts::
//     contentWorldBounds descends to the children ONLY for groups);
//   - the click is NOT captured as by a group: the children of a frame are
//     selected directly, which is the artboard convention
//     (store/groups.ts::selectionTargetOf).
// Auto layout: the frame ARRANGES its children in a row by itself, and the
// result (x/y of the children, and width/height of the frame if "hug") is
// written into the document as normal fields by the core, after every op that
// touches it. Clients compute nothing authoritative: they read positions that
// are already correct, which is what makes the document identical for the
// browser and for MCP agents.
//
// UNSPECIFIED collapses to HORIZONTAL (direction) and START (alignments), like
// StrokeAlign and TextAlign: proto3's zero is indistinguishable from "absent".
enum LayoutDirection {
  LAYOUT_DIRECTION_UNSPECIFIED = 0;
  LAYOUT_DIRECTION_HORIZONTAL = 1;
  LAYOUT_DIRECTION_VERTICAL = 2;
}
enum LayoutAlign {
  LAYOUT_ALIGN_UNSPECIFIED = 0;
  LAYOUT_ALIGN_START = 1;
  LAYOUT_ALIGN_CENTER = 2;
  LAYOUT_ALIGN_END = 3;
  // Only for main_align: distributes the free space between the children. On
  // the cross axis it behaves as START.
  LAYOUT_ALIGN_SPACE_BETWEEN = 4;
  // Only for cross_align of a HORIZONTAL layout: the children's first baselines coincide (a text's
  // from its font size and line height, any other node's from its bottom edge). On the main axis
  // and in a vertical layout it behaves as START.
  LAYOUT_ALIGN_BASELINE = 5;
}
message AutoLayout {
  LayoutDirection direction = 1;
  double spacing = 2;      // space between two consecutive children, >= 0
  double padding_left = 3;
  double padding_top = 4;
  double padding_right = 5;
  double padding_bottom = 6;
  LayoutAlign main_align = 7;   // along the direction
  LayoutAlign cross_align = 8;  // across the direction
  // "Hug": that axis of the frame fits its content instead of keeping the size
  // written in width/height. Independent of the direction.
  bool hug_width = 9;
  bool hug_height = 10;
  // WRAP (horizontal and vertical direction alike): when the children do not fit the
  // frame's main extent they continue on a new line. Ignored when the main axis hugs
  // (a hugging frame is as long as its content). `cross_spacing` is the gap between lines.
  bool wrap = 11;
  double cross_spacing = 12;   // >= 0
  // GRID mode (see docs/layout.md): `direction`, `spacing`, `wrap` and `cross_spacing` are
  // ignored; the children sit in the cells of `columns` x `rows` instead. Unset = FLEX.
  LayoutMode mode = 20;
  repeated GridTrack columns = 21;   // declared column tracks (implicit ones are hug)
  repeated GridTrack rows = 22;      // declared row tracks
  double column_gap = 23;            // >= 0, between two columns
  double row_gap = 24;               // >= 0, between two rows
}

enum LayoutMode {
  LAYOUT_MODE_FLEX = 0;  // a row / column (default)
  LAYOUT_MODE_GRID = 1;  // rows x columns of tracks
}

enum GridTrackKind {
  GRID_TRACK_KIND_FIXED = 0;  // `size` pixels (default)
  GRID_TRACK_KIND_HUG = 1;    // as big as the biggest child that sits in it
  GRID_TRACK_KIND_FR = 2;     // a share of the free space, `size` is the weight (<= 0 counts as 1)
}

message GridTrack {
  GridTrackKind kind = 1;
  double size = 2;  // >= 0, finite
}

// Where a child sits in its GRID parent. 1-based; 0 start = auto-placed (row-major), 0 span = 1.
message GridPlacement {
  int32 column = 1;
  int32 column_span = 2;
  int32 row = 3;
  int32 row_span = 4;
}

// How a node is sized by its auto layout PARENT, per axis of the node (not of the layout).
// FILL: the node takes the free space of that axis -- on the layout's main axis the
// space is shared equally among the children that fill, on the cross axis the node
// spans the whole inner extent. FIXED (default): it keeps its own width/height.
enum LayoutSizing {
  LAYOUT_SIZING_FIXED = 0;
  LAYOUT_SIZING_FILL = 1;
}

// CONSTRAINTS: how a node follows its parent FRAME when that frame is resized (without auto
// layout), per axis. MIN is left/top, MAX is right/bottom, STRETCH keeps both margins,
// CENTER keeps the distance from the center, SCALE scales position and size with the frame.
enum Constraint {
  CONSTRAINT_UNSPECIFIED = 0;   // same as MIN
  CONSTRAINT_MIN = 1;
  CONSTRAINT_MAX = 2;
  CONSTRAINT_STRETCH = 3;
  CONSTRAINT_CENTER = 4;
  CONSTRAINT_SCALE = 5;
}

message FrameNode {
  // Clips the children to the frame's box. It is not a rendering detail: what
  // the clip hides is not even CLICKABLE nor selectable with the rubber band --
  // the three tree descents (drawing, hit-test, marquee) must answer on the
  // same pixels, otherwise the selection ends up on a node the user cannot see.
  //
  // Optional, i.e. a field and not an invariant of the frame: a frame without
  // clipping remains a container with its own bounds (useful for grouping by
  // giving an explicit frame), and the proto3 default (false) is therefore a
  // legitimate value, not "unset".
  bool clips_content = 1;
  // Present = the frame arranges its children (see AutoLayout). Absent = the
  // children stay where their x/y put them. Written with the "auto_layout" mask.
  AutoLayout auto_layout = 2;
}

enum TextAlign {
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_LEFT = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_RIGHT = 3;
}

message TextStyle {
  string font_family = 1;    // "" => renderer default
  double font_size = 2;      // px in world coordinates
  string font_weight = 3;    // "400" | "700" | ...
  double line_height = 4;    // multiplier, 0 => 1.2
  TextAlign align = 5;       // LEFT | CENTER | RIGHT
  bool italic = 6;           // false => upright; draws the family's italic face when it has one
  bool underline = 7;
  bool strikethrough = 8;
  double letter_spacing = 9; // px added after every character (tracking); 0 = none, may be negative

  // Fields 20..39 are the type-and-effects range (case, scripts, lists, OpenType).
  TextCase text_case = 20;       // UNSPECIFIED => as typed
  TextScript text_script = 21;   // UNSPECIFIED => baseline
  ListKind list_kind = 22;       // UNSPECIFIED => no list; applies to every paragraph of the node
  double indent = 23;            // >= 0, world px added to the left of every paragraph (and of a list's marker)
  // CSS font-feature-settings value ("liga" 0, "tnum", "ss01"); "" => the font's defaults.
  // Plain characters only: it ends up in ctx.fontVariant*, SVG and CSS.
  string font_features = 24;
  TextVAlign vertical_align = 25; // where the text sits inside a box taller than it
  double inset = 26;              // >= 0, padding between the box and the text on every side

  // Fields 30..49 are the text-scale range.
  // Horizontal scale of the glyphs in percent: 0 => 100 (unscaled), otherwise 1..1000. Widens or narrows
  // every glyph (and so the layout) without changing the height of the line.
  double text_scale = 30;
}

// Text case: a transform of what is DRAWN, the content keeps its capitalisation.
enum TextCase {
  TEXT_CASE_UNSPECIFIED = 0;
  TEXT_CASE_UPPER = 1;
  TEXT_CASE_LOWER = 2;
  TEXT_CASE_TITLE = 3;       // first letter of every word upper, the rest lower
  TEXT_CASE_SMALL_CAPS = 4;  // lowercase letters drawn as smaller capitals
}

enum TextScript {
  TEXT_SCRIPT_UNSPECIFIED = 0;
  TEXT_SCRIPT_SUPER = 1;
  TEXT_SCRIPT_SUB = 2;
}

// Paragraph list: every paragraph (line break in the content) is an item.
enum ListKind {
  LIST_KIND_UNSPECIFIED = 0;
  LIST_KIND_BULLET = 1;
  LIST_KIND_NUMBERED = 2;
}

enum TextVAlign {
  TEXT_V_ALIGN_UNSPECIFIED = 0; // TOP
  TEXT_V_ALIGN_MIDDLE = 1;
  TEXT_V_ALIGN_BOTTOM = 2;
}

// The text box is x/y/width/height of the Node (as for rect/ellipse): width is
// the wrap width, height the one measured by the layout.
//
// RICH TEXT. `style` is the text's own style. `paragraph_styles[i]` names a paragraph style
// (a TextStyleDef of kind PARAGRAPH) for paragraph i, a paragraph being a "\n"-separated piece of
// content; missing or "" => the text's own style. `runs` apply character styles (kind CHARACTER)
// over ranges of `content`: sorted, non-overlapping, 0 <= start < end <= length of content, in UTF-16
// code units (the unit of JavaScript strings, which is what the editor indexes). A style id that no
// longer exists is ignored when drawing.
message TextNode {
  string content = 1;
  TextStyle style = 2;
  repeated string paragraph_styles = 3;
  repeated TextRun runs = 4;
}
message TextRun { int32 start = 1; int32 end = 2; string style_id = 3; }

// The image is a REFERENCE, never bytes. `asset_hash` is the sha256 of the
// bytes in lowercase hex; the bytes live ONCE in
// <workspace>/<docId>.opendesigner/assets/ and are served via GET /assets-api/{docId}/{hash}.
//
// This is the point of content addressing: a CreateNode carrying an image would
// bring those bytes into the op-log, i.e. an append-only file that never fully
// compacts -- the same photo dragged ten times would weigh ten times as much,
// and every Subscribe catch-up would send it over the wire again. With the hash
// the op stays a few dozen bytes and the pixels never enter the op flow.
message ImageNode { string asset_hash = 1; }

// An anchor point of a vector path.
//
// TWO SPACES, and it is the most important rule of the whole message -- the
// renderer, the hit-test and the pen tool must read it in exactly the same way,
// in Go and in TypeScript (web/src/store/vectorGeometry.ts is the only
// implementation).
//
// 1. `x`/`y` are in NODE-LOCAL coordinates: the origin is (Node.x, Node.y), so
//    the point in world coordinates is (Node.x + x, Node.y + y).
//    NOT in world coordinates, and it is not a whim: every existing consumer
//    works on the node's box -- selectTool sends a setProps{x,y} to drag, the
//    overlay draws the selection from x/y/width/height, the renderer discards a
//    node with width/height <= 0. With anchors in world coordinates, dragging a
//    vector node would move the box and leave the path where it was, unless ALL
//    the geometry were rewritten on every move (one more rule that nobody
//    applies). With local anchors, the geometry travels with the node for
//    free -- and it will stay that way when track 1 makes coordinates relative
//    to the parent: a vector inside a group will move with the group without
//    one extra line.
//
// 2. `in_`/`out_` are OFFSETS RELATIVE TO THE ANCHOR (not points): the control
//    point of the curve that ENTERS the anchor is (x + in_x, y + in_y), the one
//    of the curve that EXITS it is (x + out_x, y + out_y).
//    Relative because that way -- and ONLY that way -- the proto3 default tells
//    the truth: (0,0) is the handle COINCIDENT with the anchor, i.e. "no handle,
//    the segment is a straight line". With absolute handles an anchor decoded
//    without in_/out_ would have its handles at the node's ORIGIN, i.e. a curve
//    that crashes into it: the most common case of all (a corner point) would be
//    the only one not representable at zero, and every writer would have to
//    remember to fill all six fields even when they are not needed.
//    It is also the reason most formats keep them relative.
//    The price -- an addition in the renderer -- is paid in a single place
//    (vectorGeometry.ts), and for free at that: bezierCurveTo with both controls
//    coinciding with the endpoints draws exactly the straight line, so the "no
//    handle" case does not even need a branch.
message Anchor {
  double x = 1; double y = 2;
  double in_x = 3; double in_y = 4;
  double out_x = 5; double out_y = 6;
}

// An outline: a sequence of anchors, closed or open. `closed` is given and not
// derived (first anchor == last): a closed path is filled and hit-tested on its
// fill, an open one on proximity to the line.
message SubPath { repeated Anchor anchors = 1; bool closed = 2; }

// Multiple subpaths per node: an outer outline and its holes (or several
// disconnected outlines) are ONE object for the user, hence a single node.
//
// THE BOX. Node.x/y/width/height remain what they are for rect and ellipse: the
// node's box. They are not derived from the geometry by whoever applies the op
// -- neither core.Apply nor applyOp recompute them -- because the bbox of a
// cubic is not a two-line copy and two "identical" implementations of that math
// would diverge at the first edge case, precisely on the invariant this track
// exists to defend.
//
// The invariant therefore belongs to the WRITER, and it is worth spelling out:
// after a SetVectorPath, the local bbox of the geometry is (0,0)-(width,height).
// That is: whoever rewrites the subpaths normalizes (translates the anchors so
// that the minimum is (0,0)) and sends, in the SAME GESTURE, the SetProperties
// that updates x/y/width/height. This way a vector node is indistinguishable
// from a rectangle for the rest of the editor: the selection surrounds it, the
// resize has a box to work on, and the pen tool is the only place that knows
// the rule. web/src/store/vectorGeometry.ts::vectorBounds is the only
// implementation of the bbox, so "written twice" is not even possible. And it
// is the TRUE bbox of the curve (derivative solved per axis, and only on the
// segments actually drawn), not the envelope of the control points: with the
// latter the box declared here would be a superset -- up to 33% empty on a
// single cubic -- and the SELECTION would pay for it, with resize handles that
// do not touch the path and a marquee that grabs without grazing the ink.
//
// It holds in BOTH DIRECTIONS, and the second is the one that costs something:
// not even the BOX can change without the geometry following, otherwise a drag
// of the 8 resize handles (which is a single SetProperties{x,y,width,height})
// would violate the invariant with no SetVectorPath in sight -- box grown, ink
// at the previous size. Whoever resizes a vector node therefore rewrites the
// anchors with the same transformation, IN THE SAME GESTURE
// (web/src/store/vectorGeometry.ts::resizeVector, emitted by
// web/src/tools/selectTool.ts). The anchors remain lengths in local
// coordinates and NOT 0..1 fractions of the box: normalized they would be
// undefined for every path with a degenerate axis (a horizontal segment:
// division by zero) and would force the pen tool to renormalize all the
// geometry on every added point.
//
// A DEGENERATE axis is a legitimate state and the box does not falsify it: a
// single-anchor path has width and height 0, a horizontal segment has height 0.
// The click does not go through the box (it hits the ink,
// web/src/renderer/shapes.ts::hitTestNode), and whoever needs to pass a MARQUEE
// over it widens it on their own
// (web/src/renderer/shapes.ts::selectionBoundsOfNode) -- that is a selection
// tolerance, not a fact about the geometry.
message VectorNode { repeated SubPath subpaths = 1; }

// M4 — a COMPONENT is a MASTER subtree that lives in `nodes` like any other
// (it is visible and editable on the canvas). Document.components indexes it by
// id; the value points to the master's root node and carries a name. An
// INSTANCE (InstanceNode) renders it VIRTUALLY at its own transform, so
// master->instance propagation is free: instances read the live master.
message Component {
  string root_node_id = 1; // root of the master, inside Document.nodes
  string name = 2;
  // VARIANTS: the component set this component is a variant of ("" = standalone) and its
  // value on every axis of the set (axis name -> option). See ComponentSet.
  string set_id = 3;
  map<string, string> variant = 4;
  // PROPERTIES an instance can set (see ComponentProperty).
  repeated ComponentProperty properties = 5;
}

enum ComponentPropertyType {
  COMPONENT_PROPERTY_TYPE_UNSPECIFIED = 0;
  COMPONENT_PROPERTY_TYPE_BOOLEAN = 1;  // shows/hides the target nodes
  COMPONENT_PROPERTY_TYPE_TEXT = 2;     // sets the content of the target text nodes
  // A number written to ONE attribute of the target nodes (see `attribute`).
  COMPONENT_PROPERTY_TYPE_NUMBER = 3;
  // Makes a NESTED INSTANCE (the target nodes) show another component; the value is a
  // component id.
  COMPONENT_PROPERTY_TYPE_INSTANCE_SWAP = 4;
}

// A property of a component: a named knob that an instance turns without editing the
// master's nodes. It controls nodes INSIDE the master's subtree. Instances store
// their values by property NAME (InstanceNode.property_values), so the same
// property can exist on every variant of a set and survive a variant switch.
message ComponentProperty {
  string name = 1;                      // unique within the component
  ComponentPropertyType type = 2;
  string default_value = 3;             // BOOLEAN: "true" | "false"; TEXT: the text; NUMBER: a number;
                                        // INSTANCE_SWAP: a component id ("" = keep the nested one)
  repeated string target_node_ids = 4;  // master nodes it controls (text nodes for TEXT, instances for INSTANCE_SWAP)
  // NUMBER only: which attribute of the targets the number drives: "opacity" (0..1),
  // "corner_radius" (rectangles) or "font_size" (text).
  string attribute = 5;
  // TEXT only: the allowed values (an option list). Empty = free text.
  repeated string options = 6;
}

// A COMPONENT SET groups the variants of a component. Each AXIS is a named choice
// (e.g. "State": default | hover | disabled); every member component assigns one
// option per axis, and no two members assign the same combination. An instance picks
// a variant by setting options (InstanceNode.variant_props); the axes it does not set
// keep the values of the component it was created from.
message VariantAxis { string name = 1; repeated string options = 2; }
message ComponentSet {
  string id = 1;
  string name = 2;
  repeated VariantAxis axes = 3;
}

// A per-instance override on ONE node of the master. Minimal (design M4): fill
// and text. The *_present flags distinguish "not overridden" from "overridden
// to empty", like SetText.style_present: without them, a text-only override
// would wipe the fill inherited from the master.
message InstanceOverride {
  string master_node_id = 1;
  repeated Paint fills = 2;
  bool fills_present = 3;
  string text = 4;
  bool text_present = 5;
}

// shape 37: an instance of a component. Renders the master subtree of
// `component_id` at the Node's transform (x/y), with the overrides applied per
// master node. The instance's children are NOT in `nodes`: they are derived
// from the master on every read (renderer, hit-test, bounds).
message InstanceNode {
  string component_id = 1;
  repeated InstanceOverride overrides = 2;
  // Values of the component's properties, by property name; absent = the default.
  map<string, string> property_values = 3;
  // Variant choice, axis name -> option; absent axes keep the base component's value.
  map<string, string> variant_props = 4;
}

message Node {
  string id = 1;
  string parent_id = 2;   // id of the container node OR id of a Page (for roots)
  string order_key = 3;   // fractional index
  string name = 4;
  bool visible = 5;
  double opacity = 6;     // 0..1
  double x = 10; double y = 11; double width = 12; double height = 13; double rotation = 14;
  repeated Paint fills = 20;
  // Number 21 was RESERVED by the design from the start and is now implemented
  // (track 2). Repeated like `fills`, and with the same write semantics: the
  // "strokes" mask REPLACES the whole list, it does not merge its elements.
  repeated Stroke strokes = 21;
  // Effects (shadows, blur). Repeated like `fills`: the "effects" mask REPLACES
  // the whole list. The renderer currently draws the FIRST shadow and the FIRST
  // blur of a node: the 2D canvas has a single shadow state.
  repeated Effect effects = 22;
  oneof shape {
    RectNode rect = 30;
    EllipseNode ellipse = 31;
    TextNode text = 32;
    // Numbers assigned in advance to the four parallel tracks. Each track
    // replaces ONLY its own row with the real declaration (and defines the
    // corresponding message): distinct rows merge without conflicts.
    GroupNode group = 33;   // track 1 — nesting (see GroupNode above)
    FrameNode frame = 34;   // track 1 — nesting (see FrameNode above)
    ImageNode image = 35;   // track 3 — periphery (see ImageNode above)
    VectorNode vector = 36; // track 4 — vector (see VectorNode above)
    InstanceNode instance = 37; // M4 — component instance (see InstanceNode above)
    // 60-69: the shapes-and-paints track's.
    PolygonNode polygon = 60;
    StarNode star = 61;
  }
  // Free-form key -> value metadata: the bridge between design and product.
  // Conventions (not enforced by the model, read by the flow tools):
  //   "flow.kind"       screen | decision | action | start | end | note
  //   "code.route"      the app route that implements this screen
  //   "code.component"  the code component that implements it
  //   "test.id"         the data-testid a test uses to find this element
  //   "test.text"       the accessible text it uses to find it
  //   "status"          planned | implemented | tested
  // The "meta" mask REPLACES the whole map, like `fills` for lists.
  map<string, string> meta = 40;
  // Variable bindings: property -> variableId. A bound property takes its value
  // from the variable (resolved for the node's active mode) instead of from the
  // literal stored on the node, which stays as the fallback. Keys:
  //   "fills.N" | "strokes.N"   COLOR    the color of the Nth solid paint
  //   "opacity" | "rotation"    NUMBER
  //   "corner_radius"           NUMBER   rectangles only
  //   "strokes.N.weight"        NUMBER
  //   "font_size"               NUMBER   text nodes only
  //   "text"                    STRING   text nodes only (the content)
  //   "visible"                 BOOLEAN  show / hide the node (a hidden node leaves its auto layout)
  //   "spacing" | "cross_spacing" | "padding_left" | "padding_top" | "padding_right" | "padding_bottom"
  //                             NUMBER   frames with auto layout only (>= 0); the layout engine reads
  //                                      them in the frame's active mode
  // The "bindings" mask REPLACES the whole map, like `meta`.
  map<string, string> bindings = 41;
  // Mode override: collectionId -> modeId. A node (typically a frame) can pin a
  // collection to one of its modes; the override applies to the whole subtree
  // and the nearest ancestor wins. Without one, the collection's first mode is
  // used. The "modes" mask REPLACES the whole map.
  map<string, string> modes = 42;
  // Shared text style (see TextStyleDef). On a text node, the node draws with the
  // style's values instead of its own `style`, which stays as the fallback
  // (detaching gives it back). The "text_style_id" mask path writes it; empty
  // detaches. Only text nodes take one.
  string text_style_id = 43;
  // Constraints (see Constraint): how this node follows its parent frame's resize, per axis.
  // The "constraint_x" / "constraint_y" mask paths write them.
  Constraint constraint_x = 44;
  Constraint constraint_y = 45;
  // Sizing by an auto layout parent (see LayoutSizing), per axis of THIS node.
  // The "layout_sizing_x" / "layout_sizing_y" mask paths write them.
  LayoutSizing layout_sizing_x = 46;
  LayoutSizing layout_sizing_y = 47;
  // Blend mode against what is behind the node (see BlendMode). The "blend_mode" mask path writes it.
  BlendMode blend_mode = 48;
  // A MASK node is not drawn: its outline clips every sibling ABOVE it in the same parent.
  // Only shapes with an outline (rect, ellipse, frame, vector) mask. The "is_mask" mask path writes it.
  bool is_mask = 49;
  // Layout grids of a FRAME (see LayoutGrid): editor guides and snap targets, never exported.
  // The "layout_grids" mask path REPLACES the whole list; only frames take one.
  repeated LayoutGrid layout_grids = 50;
  // Shared paint / effect styles (see PaintStyleDef, EffectStyleDef): a node that names one draws with the
  // style's paints / effects instead of its own `fills` / `strokes` paints / `effects`, which stay as the
  // fallback. The "fill_style_id" / "stroke_style_id" / "effect_style_id" mask paths write them; empty detaches.
  // (Numbers 90-92 are the shapes-and-paints track's.)
  string fill_style_id = 90;
  string stroke_style_id = 91;
  string effect_style_id = 92;
  // Size limits, enforced by the layout engine when the node sits in an auto layout frame (or
  // is an auto layout frame that hugs): the computed size is clamped to [min, max]. 0 = no
  // limit; when min > max the min wins. Written by the "min_width", "max_width",
  // "min_height" and "max_height" mask paths; each is finite and >= 0.
  double min_width = 70;
  double max_width = 71;
  double min_height = 72;
  double max_height = 73;
  // ABSOLUTE: inside an auto layout frame the node leaves the flow (no room taken, not
  // hugged, not aligned) and keeps its x/y, following the frame's size by its constraints.
  // The "layout_positioning" mask path writes it.
  LayoutPositioning layout_positioning = 74;
  // The cell of a GRID auto layout parent the node occupies; absent = auto-placed, one cell.
  // The "grid_cell" mask path writes it.
  GridPlacement grid_cell = 100;
}

enum LayoutPositioning {
  LAYOUT_POSITIONING_AUTO = 0;      // takes part in the flow (default)
  LAYOUT_POSITIONING_ABSOLUTE = 1;  // out of the flow, positioned by x/y and constraints
}

enum LayoutGridKind {
  LAYOUT_GRID_KIND_UNSPECIFIED = 0;
  LAYOUT_GRID_KIND_GRID = 1;     // square cells of `size`
  LAYOUT_GRID_KIND_COLUMNS = 2;  // `count` columns between the margins, `gutter` apart
  LAYOUT_GRID_KIND_ROWS = 3;     // `count` rows between the margins, `gutter` apart
}

// A grid drawn over a frame, in the frame's own coordinates (its origin is the frame's
// top-left corner). Its lines are snap targets for the nodes dragged inside the frame.
message LayoutGrid {
  LayoutGridKind kind = 1;
  double size = 2;    // GRID: cell side, > 0
  int32 count = 3;    // COLUMNS / ROWS: how many, 1..1000
  double gutter = 4;  // COLUMNS / ROWS: space between two, >= 0
  double margin = 5;  // COLUMNS / ROWS: space at both ends, >= 0
  Color color = 6;    // tint of the overlay (alpha included)
}

// A page. A MASTER page (is_master) is a template: its nodes are drawn behind the nodes of every
// page that applies it (master_id), they cannot be selected from those pages, and a text with the
// token "<#>" shows the page's number there. A master cannot apply another master, and a document
// always keeps at least one page that is not a master.
message Page {
  string id = 1;
  string name = 2;
  bool is_master = 3;
  string master_id = 4; // a master page's id, or empty
  // PAGE SETUP. A page with a size is a sheet: width x height world units at the origin (0, 0); 0 means
  // an unbounded canvas page (the default). Margins, columns and bleed are guides drawn on the sheet;
  // exports of a sized page are the sheet (plus bleed when asked), not the bounding box of its content.
  double width = 5;
  double height = 6;
  double margin_top = 7;
  double margin_right = 8;
  double margin_bottom = 9;
  double margin_left = 10;
  uint32 columns = 11;   // 0 or 1 = a single column
  double gutter = 12;    // space between columns
  double bleed = 13;     // extra area around the sheet that is printed and trimmed
  // PAGE NUMBERS. A page with section_start begins a numbering section: its number is number_start
  // (0 = 1) in number_style ("" = 1 2 3, "i", "I", "a", "A"); the pages after it continue the count
  // until the next section. Masters are not numbered. The first page is a section start by default.
  bool section_start = 14;
  uint32 number_start = 15;
  string number_style = 16;
  // With facing pages a page can use another master on the left-hand side.
  string left_master_id = 17;
  // Ids of master nodes this page has OVERRIDDEN: it does not show them (its own copy, if any, is an
  // ordinary node of the page).
  repeated string hidden_master_items = 18;
  double slug = 19;      // area beyond the bleed for printer's marks and notes
  repeated Guide guides = 20;
}
// A ruler guide: a vertical line at x = position, or a horizontal one at y = position.
message Guide { bool vertical = 1; double position = 2; }

// ---------- typography ----------
// A FONT FACE is an uploaded font file: one weight/style of one family. The bytes
// are a content-addressed asset (like images); the document only references them.
// A TextStyle.font_family that names `family` draws with this file, in the
// editor, in PNG/SVG export and in generated code (@font-face).
message FontFace {
  string id = 1;
  string family = 2;       // the CSS family name text styles refer to
  string weight = 3;       // "100".."900"
  string style = 4;        // "normal" | "italic"
  string asset_hash = 5;   // sha256 hex of the TTF/OTF/WOFF/WOFF2 bytes
}
// A named, reusable text style. Text nodes point to it with Node.text_style_id.
//
// A PARAGRAPH style sets the look of whole paragraphs; a CHARACTER style (kind CHARACTER) overrides
// only some fields (family, size, weight, italic, underline, strikethrough: those that are set) over a
// range of characters. `based_on` inherits the fields that are unset from another style of the same
// kind; `next_style_id` is the paragraph style a new paragraph gets after one in this style. Spacing
// and indents (px) are for paragraph styles only.
enum TextStyleKind {
  TEXT_STYLE_KIND_PARAGRAPH = 0;
  TEXT_STYLE_KIND_CHARACTER = 1;
}
message TextStyleDef {
  string id = 1;
  string name = 2;
  TextStyle style = 3;
  TextStyleKind kind = 4;
  string based_on = 5;
  string next_style_id = 6;
  double space_before = 7;
  double space_after = 8;
  double indent_first = 9; // extra indent of the first line
  double indent_left = 10;
  // Paragraph styles only: the lines of the paragraph sit on the document's baseline grid
  // (DocSettings.baseline_*), moving down to the next grid line when they would fall between two.
  bool align_to_grid = 11;
}
// Named, reusable paints and effects. A node points to them with Node.fill_style_id / stroke_style_id /
// effect_style_id. A paint style's paints are a fills list; a stroke that uses it takes the paint at its own
// index (the last one when there are fewer), keeping its weight and alignment.
message PaintStyleDef { string id = 1; string name = 2; repeated Paint paints = 3; }
message EffectStyleDef { string id = 1; string name = 2; repeated Effect effects = 3; }

// ---------- variables (design tokens) ----------
// A COLLECTION groups variables that share the same MODES (e.g. "Light" and
// "Dark"). Every variable has one value per mode. The first mode is the
// default: it is used when nothing overrides the mode and when a variable has
// no value for the active one.
message VariableMode { string id = 1; string name = 2; }
message VariableCollection {
  string id = 1;
  string name = 2;
  repeated VariableMode modes = 3;    // at least one; ids unique within the collection
}
enum VariableType {
  VARIABLE_TYPE_UNSPECIFIED = 0;
  VARIABLE_TYPE_COLOR = 1;
  VARIABLE_TYPE_NUMBER = 2;
  VARIABLE_TYPE_STRING = 3;
  VARIABLE_TYPE_BOOLEAN = 4;   // binds to Node.visible
}
message VariableValue { oneof kind { Color color = 1; double number = 2; string text = 3; bool boolean = 4; } }
message Variable {
  string id = 1;
  string collection_id = 2;
  string name = 3;                    // "color/primary": '/' makes groups in the UI
  VariableType type = 4;
  map<string, VariableValue> values = 5; // modeId -> value
  // ALIAS: when set, this variable holds no values of its own and reads the
  // value of the variable it names (a semantic token over a primitive). The
  // target exists, has the same type and the chain has no cycle; it may live in
  // another collection. The value is the target's in the mode of the alias's
  // collection active on the node, when the target's collection has a mode with
  // that id, else in the target's first mode.
  string alias_of = 6;
}

// ---------- flows ----------
// A FLOW is a user path through the screens: a set of TRANSITIONS (edges)
// between design nodes. Screens are NOT copies: they are the document's frames,
// referenced by id, so the flow stays attached to the real design -- moving or
// renaming a screen does not break it, deleting it deletes its edges (see
// core.applyDelete).
message Flow {
  string id = 1;
  string name = 2;
  string description = 3;
  // Entry screen (id of a node) or empty.
  string start_id = 4;
}

message Transition {
  string id = 1;
  string flow_id = 2;
  string from_id = 3;
  string to_id = 4;
  string label = 5;
  // What triggers it: "click" | "submit" | "auto" | "key" | "back" | free text.
  string trigger = 6;
  // Optional: the node INSIDE from_id that triggers it (the clickable hotspot).
  string element_id = 7;
  // Condition under which the edge can be followed, and what the edge changes.
  // Free text: read by people, agents and the playable prototype
  // ("cart not empty" / "cart=empty").
  string guard = 8;
  string effect = 9;
  // How the prototype player goes from `from_id` to `to_id`: "" (cut) | "dissolve" |
  // "slide-left|right|up|down" (the new screen slides over the old one) |
  // "push-left|right|up|down" (both move) | "smart" (nodes with the same name in both
  // screens move and fade into place). Closed set: see core.TransitionAnimations.
  string animation = 10;
  int32 duration_ms = 11;  // 0..10000; 0 = the player's default (300)
  string easing = 12;      // the animation easing grammar (core.ValidEasing); "" = easeInOut
  // For trigger "auto": how long the player waits on the screen before following it (0..60000).
  int32 delay_ms = 13;
  // Position in the if / else if / else CHAIN of this transition's hotspot (the transitions of one
  // flow that leave the same screen on the same trigger and element): 1, 2, 3... in the order the
  // player evaluates them, the first whose guard holds being the one that applies. 0 = not in a
  // chain (an independent branch, as before). 0..1000; an `else` guard needs no order of its own.
  int32 order = 20;
}

// ---------- animation ----------
// A CLIP is a declarative animation: a set of TRACKS (node, property) each with
// keyframes. Clips belong to a "target" node (screen, group, imported SVG)
// whose hover/tap/enter starts them; the animated nodes are referenced by id,
// never copied. See internal/core/animation.go.
message Keyframe {
  double time = 1;    // milliseconds from the start of the clip, 0..duration
  double value = 2;   // numeric value of the property
  // "linear" | "easeIn" | "easeOut" | "easeInOut" | "spring" |
  // "cubic-bezier(a,b,c,d)" | "" (= linear). Easing of the segment that STARTS
  // from this keyframe.
  string easing = 3;
}
message Track {
  string node_id = 1;
  // opacity (0..1) | x | y (local coordinates of the node, absolute) | scale
  // (multiplier, base 1) | rotation (absolute degrees) | draw (0..1: how much
  // of the outline is drawn; vector/stroked shapes only)
  string prop = 2;
  repeated Keyframe keyframes = 3;   // sorted by time, at least 1
}
message Clip {
  string id = 1;
  string name = 2;                    // "enter", "hover", "loading"...
  double duration = 3;                // ms, > 0
  string trigger = 4;                 // "enter" | "hover" | "tap" | "loop" | "manual"
  double delay = 5;                   // ms
  int32 repeat = 6;                   // extra repetitions; -1 = infinite
  bool yoyo = 7;
  repeated Track tracks = 8;
  string target_id = 9;               // the node (screen/group/SVG) the clip belongs to
}

message Document {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  repeated Page pages = 4;
  map<string, Node> nodes = 5;
  // M4 — components: componentId -> master (root node in `nodes` + name).
  map<string, Component> components = 6;
  map<string, Flow> flows = 7;
  map<string, Transition> transitions = 8;
  // Animations: clipId -> clip.
  map<string, Clip> clips = 9;
  // Variables (design tokens): collectionId -> collection, variableId -> variable.
  map<string, VariableCollection> collections = 10;
  map<string, Variable> variables = 11;
  // Typography: fontId -> uploaded font file, textStyleId -> shared text style.
  map<string, FontFace> fonts = 12;
  map<string, TextStyleDef> text_styles = 13;
  // Variants: setId -> component set.
  map<string, ComponentSet> component_sets = 14;
  // Comments: commentId -> comment (see Comment).
  map<string, Comment> comments = 15;
  // Shared paint and effect styles: styleId -> definition (fields 60-69 are the shapes-and-paints track's).
  map<string, PaintStyleDef> paint_styles = 60;
  map<string, EffectStyleDef> effect_styles = 61;
  // Dev mode (fields 70-79 are reserved for it): annotations by id, and the frames marked
  // ready for dev by the frame's node id (see Annotation, ReadyForDev).
  map<string, Annotation> annotations = 70;
  map<string, ReadyForDev> ready_for_dev = 71;
  DocSettings settings = 16;
}

// Settings of the document as a whole.
//  - vertical: the kind of work the document is for. It shapes the editor (which modes, tools and menu
//    entries are offered) and the templates; it never limits what the document can hold. "" is "product".
//      "publishing" -- books, magazines, reports: pages, masters, text frames, styles, PDF / EPUB
//      "design"     -- illustration, UI design, boards: vector, components, variables
//      "product"    -- design and development together: flows, prototype, handoff, code
//  - baseline_increment: distance between the lines of the baseline grid (0 = no grid); baseline_start
//    is where the first line sits, from the top of the page.
message DocSettings {
  string vertical = 1;
  double baseline_increment = 2;
  double baseline_start = 3;
  // Facing pages: pages are read in spreads (the first alone, on the right; then pairs). For the margins
  // of a page, margin_left is the INSIDE (towards the fold) and margin_right the OUTSIDE.
  bool facing_pages = 4;
}

// ---------- ops ----------
message CreateNode { Node node = 1; }
message DeleteNode { string id = 1; }
message SetProperties {
  string id = 1;
  Node patch = 2;
  google.protobuf.FieldMask mask = 3; // dot path on Node, e.g. "x","y","fills"
}
// Dedicated op instead of a SetProperties mask path: the text content lives
// INSIDE the `shape` oneof, while the SetProperties mask addresses top-level
// fields of the Node. A nested path ("text.content") would force both apply
// implementations to carry a path parser.
//
// `style_present` distinguishes "unspecified" from "reset": in proto3 an absent
// sub-message and one with all fields at zero are indistinguishable after the
// protojson round-trip, so without the flag a content-only SetText would wipe
// the node's style. style_present=false => leave the existing style alone;
// true => replace it with `style` (even if empty).
message SetText {
  string id = 1;
  string content = 2;
  TextStyle style = 3;
  bool style_present = 4;
  // Rich text. With rich_present the two lists below REPLACE the node's paragraph styles and
  // runs (validated, see TextNode); without it they stay, adjusted to the new content: runs are
  // clamped to its length (dropped when empty) and paragraph_styles cut to the paragraph count.
  repeated string paragraph_styles = 5;
  repeated TextRun runs = 6;
  bool rich_present = 7;
}
// Replaces the subpaths of a VectorNode WHOLESALE. Dedicated op instead of a
// SetProperties mask path for the same reason as SetText: the geometry lives
// INSIDE the `shape` oneof, while the mask addresses top-level fields of the
// Node.
//
// The replacement is wholesale and not incremental (no "move the i-th anchor"):
// a pen gesture can add, move and delete anchors all at once, and one op per
// micro-edit would multiply the cases to keep identical between Go and TS
// without adding anything -- the inverse is the PREVIOUS subpaths in full
// anyway.
//
// An EMPTY list is legitimate and is not "unspecified": it is the path the user
// emptied. No `present` flag is needed here (unlike SetText.style_present)
// because there is no other field of the op that could stay untouched: the op
// IS the subpaths.
message SetVectorPath {
  string id = 1;
  repeated SubPath subpaths = 2;
}

// Moves a node under another container (or directly under a Page) and rewrites
// its order among the new siblings.
//
// Dedicated op and not a SetProperties mask path -- unlike `order_key`, which
// is a field like the others -- because reparenting has its own VALIDATION that
// no other field has: the new parent must exist (node or page) and cannot be
// the node itself nor one of its descendants, otherwise the subtree detaches
// from the document and becomes an unreachable cycle. A mask that wrote
// `parent_id` would force applySetProps (and its TS twin) to carry a tree
// traversal inside just for one path.
//
// `order_key` travels TOGETHER: changing parent without reordering would leave
// the node with the key computed among the OLD siblings, i.e. at an arbitrary
// position among the new ones. One op, one final position.
message ReparentNode {
  string id = 1;
  string new_parent_id = 2; // id of the container node OR id of a Page
  string order_key = 3;     // fractional index among the new siblings
}
// ---------- pages ----------
// Pages are the ROOT containers of the document: every node hangs from one of
// them (Node.parent_id accepts a node id OR a Page id) and the canvas shows one
// at a time. `Document.pages` has existed since M0 with a single page and no op
// able to touch it; these three make it a multi-page document.
//
// Three dedicated ops and not SetProperties mask paths: the mask addresses
// fields of a NODE (its id is what travels in SetProperties.id) and a page is
// not a node -- it has no geometry, no shape, no parent. A "SetProperties on a
// page" would force both apply implementations to have two disjoint path tables
// under the same op.
message CreatePage { Page page = 1; }
// Deletes the page AND ALL the nodes hanging from it, in cascade (same rule as
// DeleteNode: whatever is no longer reachable from a page is no longer part of
// the document). Rejected on the LAST remaining page: a document without pages
// has nowhere to create a node.
message DeletePage { string id = 1; }
message RenamePage { string id = 1; string name = 2; }
// ABSOLUTE upsert of an existing page's name / is_master / master_id (the inverse is the previous page).
message UpdatePage { Page page = 1; }
// Moves a page to a position in the page list (0-based; the others shift). The inverse moves it back.
message MovePage { string id = 1; uint32 index = 2; }
// ABSOLUTE upsert of the document settings (the inverse is the previous settings).
message SetDocSettings { DocSettings settings = 1; }

// op 16 (M4): registers an EXISTING subtree (root root_node_id) as the master
// of a component. It copies nothing: the master stays where it is in `nodes`,
// and from here on instances reference it by component_id.
message CreateComponent {
  string component_id = 1;
  string root_node_id = 2;
  string name = 3;
}

// op 20 (M4): sets (or clears) an instance's override on a master node. The
// replaced override is the one with the same master_node_id; an override with
// both *_present set to false REMOVES it (goes back to inheriting from the
// master).
message SetInstanceOverride {
  string instance_id = 1;
  InstanceOverride override = 2;
}
// Flows: ABSOLUTE upserts (the incoming value is the final value), like the
// SetProperties fields. A new id creates, an existing id replaces.
message SetFlow { Flow flow = 1; }
// Deletes the flow AND all its transitions.
message DeleteFlow { string id = 1; }
message SetTransition { Transition transition = 1; }
message DeleteTransition { string id = 1; }

// Clip: ABSOLUTE upsert of the whole clip (the inverse is the previous state).
message SetClip { Clip clip = 1; }
message DeleteClip { string id = 1; }

message Op {
  string op_id = 1;
  string doc_id = 2;
  oneof kind {
    CreateNode    create_node = 10;
    SetProperties set_props   = 11;
    DeleteNode    delete_node = 12;
    SetText       set_text    = 13;
    ReparentNode  reparent_node = 14; // track 1 — moves a node under another parent
    // Multiple pages (track 1). Numbers TAKEN AFTER those already assigned to
    // the other tracks (15 and 16 below): the rows stay distinct and merges
    // clean, exactly as for the `shape` oneof.
    CreatePage    create_page   = 17;
    DeletePage    delete_page   = 18;
    RenamePage    rename_page   = 19;
    SetVectorPath set_vector_path = 15; // track 4 — replaces the subpaths of a VectorNode
    CreateComponent     create_component      = 16; // M4 — registers a subtree as master
    SetInstanceOverride set_instance_override = 20; // M4 — fill/text override on an instance
    SetFlow          set_flow          = 21; // flows — upsert of a flow
    DeleteFlow       delete_flow       = 22;
    SetTransition    set_transition    = 23; // flows — upsert of an edge
    DeleteTransition delete_transition = 24;
    SetClip          set_clip          = 25; // animation — upsert of a clip
    DeleteClip       delete_clip       = 26;
    SetCollection    set_collection    = 27; // variables — upsert of a collection
    DeleteCollection delete_collection = 28;
    SetVariable      set_variable      = 29; // variables — upsert of a variable
    DeleteVariable   delete_variable   = 30;
    SetFont             set_font              = 31; // typography — upsert of a font face
    DeleteFont          delete_font           = 32;
    SetTextStyleDef     set_text_style_def    = 33; // typography — upsert of a text style
    DeleteTextStyleDef  delete_text_style_def = 34;
    SetComponentSet     set_component_set     = 35; // variants — upsert of a component set
    DeleteComponentSet  delete_component_set  = 36;
    SetComponentDef     set_component_def     = 37; // variants/properties — a component's set membership and properties
    SetInstanceProps    set_instance_props    = 38; // an instance's property values and variant choice
    SetComment          set_comment           = 39; // comments — upsert of a comment
    DeleteComment       delete_comment        = 40;
    // 60-69: the shapes-and-paints track's (shared paint / effect styles).
    SetPaintStyleDef     set_paint_style_def     = 60;
    DeletePaintStyleDef  delete_paint_style_def  = 61;
    SetEffectStyleDef    set_effect_style_def    = 62;
    DeleteEffectStyleDef delete_effect_style_def = 63;
    SetInstance         set_instance          = 70; // components — swap or reset an instance (absolute payload)
    // Dev mode (80-89 are reserved for it).
    SetAnnotation       set_annotation        = 80; // upsert of an annotation
    DeleteAnnotation    delete_annotation     = 81;
    SetReadyForDev      set_ready_for_dev     = 82; // marks a frame ready (or re-marks it: a new baseline)
    ClearReadyForDev    clear_ready_for_dev   = 83;
    UpdatePage          update_page           = 41; // master pages — a page's name, master flag and applied master
    SetDocSettings      set_doc_settings      = 42; // vertical and baseline grid (absolute upsert)
    MovePage            move_page             = 43; // reorder pages
  }
}
// A comment pinned on the canvas. A THREAD is a root comment (parent_id empty) plus its
// replies (parent_id = the root's id; replies do not nest). Position, node and page are the
// root's: a reply carries none of them.
//
//  - attached to a node (node_id set): (x, y) is an offset from the node's top-left corner,
//    in the node's own coordinates, so the pin follows the node;
//  - free (node_id empty): (x, y) is in world coordinates on the page `page_id`.
//
// `resolved` is the root's: a resolved thread is hidden from the canvas by default.
message Comment {
  string id = 1;
  string parent_id = 2;
  string node_id = 3;
  string page_id = 4;
  double x = 5;
  double y = 6;
  string author = 7;      // display name, up to 80 characters
  string text = 8;        // non-empty, up to 4000 characters
  int64 created_at = 9;   // unix seconds; 0 when unknown
  bool resolved = 10;
}
message SetComment    { Comment comment = 1; }
message DeleteComment { string id = 1; }  // a root takes its replies with it

// Replaces an instance's payload WHOLESALE: which component it points at, its overrides,
// property values and variant choice. A swap is the same op with another `component_id`
// (the client carries over the overrides that still fit); "reset all overrides" is the
// same op with the lists emptied. Everything is validated against the component it
// resolves to; the node's own transform is untouched (write width/height with SetProperties).
message SetInstance {
  string instance_id = 1;
  InstanceNode instance = 2;
}

// ---------- dev mode ----------
// An ANNOTATION is a note for the developer attached to a node: what the picture does not
// say (an interaction, an accessibility label, a content rule...). `category` is one of
// note | interaction | accessibility | content | animation | layout and gives the colour the
// editor draws it with. Annotations are shown in Dev Mode and written as comments into the
// exported code (internal/devmode, internal/codegen). Like comments, a node that disappears
// leaves its annotations in the document (undoing the deletion brings them back).
message Annotation {
  string id = 1;
  string node_id = 2;      // an existing node
  string category = 3;
  string text = 4;         // non-empty, up to 2000 characters
  string author = 5;       // display name, up to 80 characters
  int64 created_at = 6;    // unix seconds; 0 when unknown
}
// A FRAME marked ready for development. `snapshot` is the frame and its descendants as they were
// when it was marked: the baseline "Compare changes" diffs the live frame against. The server
// FILLS it when it applies the op (a client never sends one), so replaying the op log reproduces it.
message ReadyForDev {
  string node_id = 1;      // a frame
  string note = 2;         // up to 500 characters
  string marked_by = 3;    // display name, up to 80 characters
  int64 marked_at = 4;     // unix seconds; 0 when unknown
  repeated Node snapshot = 5;
}
message SetAnnotation    { Annotation annotation = 1; }
message DeleteAnnotation { string id = 1; }
message SetReadyForDev   { ReadyForDev ready = 1; }
message ClearReadyForDev { string node_id = 1; }

// Compare changes: the property-level differences between a ready frame and its snapshot.
message ReadyChange {
  string node_id = 1;
  string node_name = 2;
  string kind = 3;         // added | removed | changed
  string property = 4;     // "width", "fills[0]", "text.content", "meta.status"... empty for added / removed
  string before = 5;       // readable value ("" when the property was not set)
  string after = 6;
}
message CompareReadyRequest  { string doc_id = 1; string node_id = 2; }
message CompareReadyResponse {
  string node_id = 1;
  int64 marked_at = 2;
  repeated ReadyChange changes = 3;
}

message SetCollection    { VariableCollection collection = 1; }
message DeleteCollection { string id = 1; }
message SetVariable      { Variable variable = 1; }
message DeleteVariable   { string id = 1; }
message SetFont            { FontFace font = 1; }
message DeleteFont         { string id = 1; }
message SetTextStyleDef    { TextStyleDef text_style = 1; }
message DeleteTextStyleDef { string id = 1; }
message SetPaintStyleDef     { PaintStyleDef paint_style = 1; }
message DeletePaintStyleDef  { string id = 1; }
message SetEffectStyleDef    { EffectStyleDef effect_style = 1; }
message DeleteEffectStyleDef { string id = 1; }
// Replaces a component set. The renames say that an axis / option of the OLD set is the
// same thing under a new name, so members and instances keep their choices instead of
// being detached or reset. `OptionRename.axis` is the axis's NEW name.
message OptionRename { string axis = 1; string from = 2; string to = 3; }
message SetComponentSet {
  ComponentSet component_set = 1;
  map<string, string> axis_renames = 2;   // old axis name -> new axis name
  repeated OptionRename option_renames = 3;
}
message DeleteComponentSet { string id = 1; }
// Replaces a component's set membership, variant assignment and properties WHOLESALE
// (name and root are not touched).
message SetComponentDef {
  string component_id = 1;
  string set_id = 2;
  map<string, string> variant = 3;
  repeated ComponentProperty properties = 4;
}
// Replaces an instance's property values and variant choice WHOLESALE.
message SetInstanceProps {
  string instance_id = 1;
  map<string, string> property_values = 2;
  map<string, string> variant_props = 3;
}
message OpRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string client_id = 3;
  Op op = 4;
}

// ---------- service ----------
message OpenRequest  { string doc_id = 1; }
message OpenResponse { Document snapshot = 1; uint64 seq = 2; }
message CreateDocumentRequest { string name = 1; string vertical = 2; }
// updated_at (unix seconds, 0 = unknown), screens (top-level frames) and
// flows are for the Home page: a document's card shows them without opening it.
message DocInfo { string id = 1; string name = 2; int64 updated_at = 3; uint32 screens = 4; uint32 flows = 5; string vertical = 6; }
message RenameDocumentRequest { string doc_id = 1; string name = 2; }
message DeleteDocumentRequest { string doc_id = 1; }
message DeleteDocumentResponse {}
message ListDocumentsRequest {}
message ListDocumentsResponse { repeated DocInfo docs = 1; }

// The live channel is split into two RPCs instead of a bidirectional stream:
// browsers' `fetch` does not support streaming request bodies, so a bidi is not
// reachable from the editor. A unary upstream + a server-stream downstream give
// the same semantics and work everywhere.
message SubmitOpRequest  { string doc_id = 1; string client_id = 2; Op op = 3; }
message SubmitOpResponse { Ack ack = 1; }

message SubscribeRequest { string doc_id = 1; string client_id = 2; uint64 since_seq = 3; }

message Ack      { string op_id = 1; uint64 seq = 2; }
message ErrorMsg { string op_id = 1; string message = 2; }
message ServerMsg { oneof kind { OpRecord applied = 1; Ack ack = 2; ErrorMsg error = 3; } }

// ---------- presence (ephemeral, does NOT go through the op-log) ----------
//
// Who is looking at the document, where their cursor is and what they have
// selected. It lives only in memory in the document's hub and disappears when
// the client's WatchPresence stream closes: no accounts, no persistence -- the
// nickname is chosen by the client and lasts for the session.
//
// The cursor is in WORLD coordinates, so everyone sees it at the right spot
// whatever their own camera.
message PresenceState {
  string client_id = 1;
  string nickname = 2;
  bool has_cursor = 3;
  double cursor_x = 4;
  double cursor_y = 5;
  string page_id = 6;
  repeated string selection = 7;
  // FACILITATION. Everything below is as ephemeral as the cursor: whoever leaves takes it along.
  // The camera, so that others can follow (zoom and the world point at the canvas's top-left).
  bool has_view = 8;
  double view_x = 9;
  double view_y = 10;
  double view_zoom = 11;
  // Cursor chat and a reaction (an emoji). emote_seq grows with every one sent, so
  // that sending the same text twice is still noticed.
  string chat = 12;
  string reaction = 13;
  uint32 emote_seq = 14;
  // The nodes this peer voted for, one entry per dot (the same id twice = two dots).
  repeated string votes = 15;
  // A countdown this peer started: wall-clock milliseconds, 0 = none.
  int64 timer_started_ms = 16;
  int64 timer_end_ms = 17;
  string timer_label = 18;
}
message PresenceEvent {
  oneof kind {
    PresenceState update = 1;   // a peer joined or changed
    string left_client_id = 2;  // a peer left
  }
}
// ---------- flow analysis ----------
message FlowIssue {
  // no_start | unreachable | dead_end | no_exit | ambiguous | empty | else_orphan | shadowed
  string kind = 1;
  string flow_id = 2;
  string node_id = 3;        // the screen involved, if any
  string transition_id = 4;  // the edge involved, if any
  string message = 5;        // human-readable text (English)
}
// A path: from the entry screen to a final screen (no exits) or to a return to
// one already visited. Sequence of transitions.
message FlowPath {
  repeated string transition_ids = 1;
  repeated string node_ids = 2;  // node_ids[i] -> node_ids[i+1] via transition_ids[i]
  bool loops = 3;                // ends by returning to a screen already in the path
}
message FlowReport {
  string flow_id = 1;
  uint32 screens = 2;
  uint32 transitions = 3;
  repeated FlowIssue issues = 4;
  repeated FlowPath paths = 5;
  bool paths_truncated = 6;  // the cap on the number of paths was reached
}
// empty flow_id = all the document's flows.
message AnalyzeFlowsRequest { string doc_id = 1; string flow_id = 2; }
message AnalyzeFlowsResponse { repeated FlowReport reports = 1; }

// ---------- code export ----------
// A file of the generated project: relative path (with "/") and bytes.
message ExportFile {
  string path = 1;
  bytes content = 2;
}
// target: "react" (default: Vite + React + TypeScript + Tailwind v4 + Playwright
// flow tests), "html" (one file per screen), "swiftui" (Swift views for an
// iOS/macOS app), "compose" (Kotlin composables for an Android app) or "leptos"
// (a Leptos / Rust client-side app built with Trunk). empty
// flow_id = wires up and tests all flows.
message ExportCodeRequest {
  string doc_id = 1;
  string target = 2;
  string flow_id = 3;
}
message ExportCodeResponse {
  repeated ExportFile files = 1;
  // Approximations and omissions (missing assets, transitions to nodes that were
  // not exported): human-readable text (English).
  repeated string warnings = 2;
}

// Diagrams (internal/diagram): Mermaid text -> a GROUP of normal nodes
// (shapes, vectors, text). The function is pure: it does not touch the
// document, so the editor can insert the nodes as a single gesture (one undo)
// and an MCP agent as a sequence of ops. The first node is the root (a group
// with `diagram.kind` and `diagram.source` meta); the others are its
// descendants, with coordinates relative to the root. parent_id/order_key/x/y
// of the root are chosen by whoever inserts.
message RenderDiagramRequest { string source = 1; }
message RenderDiagramResponse {
  repeated Node nodes = 1;   // pre-order: every node after its own parent
  string kind = 2;           // flowchart | class | sequence | state
  double width = 3;
  double height = 4;
  repeated string warnings = 5;
}

// NAMED VERSIONS. A version is a frozen copy of the whole document (and nothing else is
// shared with it): it can be listed, deleted and BRANCHED -- opened as a new, editable
// document seeded from it (with the assets it uses).
message VersionInfo {
  string id = 1;
  string name = 2;
  int64 created_at = 3;  // unix seconds
  uint64 seq = 4;        // the op sequence of the document when it was taken
}
message CreateVersionRequest { string doc_id = 1; string name = 2; }
message ListVersionsRequest { string doc_id = 1; }
message ListVersionsResponse { repeated VersionInfo versions = 1; }  // newest first
message DeleteVersionRequest { string doc_id = 1; string version_id = 2; }
message DeleteVersionResponse {}
// A new document seeded from a version (version_id empty = the document as it is now).
message BranchRequest { string doc_id = 1; string version_id = 2; string name = 3; }

// ACCESS. By default a document is open to anyone who can reach the server (local-first, trusted
// network). A document can be PROTECTED: then every request must carry a link token
// (Authorization: Bearer <token>, or ?k=<token> for images), and what it may do depends on the
// link's role -- view (read), comment (read + comments), edit (everything but access and deleting),
// owner (everything). There are no accounts: a link IS the permission, shown once when it is made.
// The machine that runs the server (a request from loopback) and the holder of the server's
// -admin-token can always manage access.
message AccessLink {
  string id = 1;
  string role = 2;       // owner | edit | comment | view
  string label = 3;
  int64 created_at = 4;  // unix seconds
}
message GetAccessRequest { string doc_id = 1; }
message GetAccessResponse {
  bool enabled = 1;
  string role = 2;               // the caller's role here: owner | edit | comment | view | open (not protected)
  repeated AccessLink links = 3; // only for an owner
}
message EnableAccessRequest { string doc_id = 1; }
message EnableAccessResponse { string owner_token = 1; }   // shown once
message DisableAccessRequest { string doc_id = 1; }
message DisableAccessResponse {}
message CreateShareLinkRequest { string doc_id = 1; string role = 2; string label = 3; }
message CreateShareLinkResponse { AccessLink link = 1; string token = 2; }  // the token is shown once
message RevokeShareLinkRequest { string doc_id = 1; string link_id = 2; }
message RevokeShareLinkResponse {}

// IMPORTING A FIGMA FILE (internal/figimport). EXPERIMENTAL: .fig is not a public format. The file's
// images are stored in the document's asset store; the nodes come back like a drawn diagram
// (a wrapper group first, every node after its parent) for the editor to insert in one gesture.
message ImportFigRequest { string doc_id = 1; bytes data = 2; string name = 3; }
message ImportFigResponse {
  repeated Node nodes = 1;
  double width = 2;
  double height = 3;
  repeated string warnings = 4;  // what could not be carried over
  // The file's variables: the editor creates the collections, then the variables (in this order: the
  // target of an alias comes before the alias) before inserting the nodes, whose bindings and modes
  // name them. Empty for a file without variables.
  repeated VariableCollection collections = 5;
  repeated Variable variables = 6;
}

// MERGING A BRANCH BACK. A branch remembers the document it came from and the state it started
// from; reviewing it compares three documents (that start, the branch now, the original now) and
// lists what the branch did. Merging applies those changes to the original as ordinary ops. A
// change is in CONFLICT when the original changed the same property of the same thing since the
// start: it is left out (the original's side wins) unless prefer_branch is set.
message GetBranchOriginRequest { string doc_id = 1; }
message GetBranchOriginResponse {
  bool is_branch = 1;
  string source_doc_id = 2;
  string source_name = 3;
  bool source_exists = 4;
  int64 created_at = 5;  // unix seconds
}
message MergeChange {
  string entity = 1;   // node | page | flow | transition | clip | collection | variable | font | text_style | component_set
  string id = 2;
  string name = 3;
  string kind = 4;     // added | removed | changed
  repeated string paths = 5;           // what changed on a node
  bool conflict = 6;
  repeated string conflict_paths = 7;
}
message ReviewMergeRequest { string doc_id = 1; }  // the branch
message ReviewMergeResponse {
  string source_doc_id = 1;
  string source_name = 2;
  repeated MergeChange changes = 3;
  repeated string warnings = 4;  // changes that cannot be merged (and why)
}
message MergeBranchRequest { string doc_id = 1; bool prefer_branch = 2; }
message MergeBranchResponse {
  uint32 applied = 1;            // ops applied to the original
  uint32 skipped_conflicts = 2;  // conflicting changes left as the original has them
}

// DESIGN REVIEW (internal/review): the rules that can be decided mechanically -- text contrast
// (WCAG), tap targets and use of design tokens. Pure and deterministic.
message ReviewIssue {
  string rule = 1;      // contrast | touch-target | token
  string severity = 2;  // error | warn
  string node_id = 3;
  string node_name = 4;
  string message = 5;   // human-readable text (English)
}
message ReviewDesignRequest { string doc_id = 1; }
message ReviewDesignResponse { repeated ReviewIssue issues = 1; }

// WHITEBOARD OBJECTS (internal/board): a sticky note, a table, a kanban board, a mind map or a
// starting template, drawn as a group of plain nodes -- the same shape of answer as RenderDiagram.
message RenderBoardRequest {
  string kind = 1;            // sticky | table | kanban | mindmap | brainstorm | retrospective | user-flow | customer-journey
  repeated string items = 2;  // sticky: the text; table: header cells; kanban: column titles; mindmap: center then branches
  int32 rows = 3;             // table
  int32 columns = 4;          // table
  string color = 5;           // sticky: yellow | pink | green | blue | orange | purple
}
message RenderBoardResponse {
  repeated Node nodes = 1;    // pre-order: the root group first, every node after its own parent
  double width = 2;
  double height = 3;
}

message WatchPresenceRequest { string doc_id = 1; string client_id = 2; string nickname = 3; }
message UpdatePresenceRequest { string doc_id = 1; PresenceState state = 2; }
message UpdatePresenceResponse {}

service DocumentService {
  rpc RenderBoard(RenderBoardRequest) returns (RenderBoardResponse);
  rpc ReviewDesign(ReviewDesignRequest) returns (ReviewDesignResponse);
  // Compare changes: a frame marked ready for dev against its state when it was marked.
  rpc CompareReady(CompareReadyRequest) returns (CompareReadyResponse);
  rpc CreateVersion(CreateVersionRequest) returns (VersionInfo);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc DeleteVersion(DeleteVersionRequest) returns (DeleteVersionResponse);
  // Opens a version (or the current state) as a NEW document: a branch to edit without touching the original.
  rpc BranchDocument(BranchRequest) returns (DocInfo);
  // Access control (see AccessLink). Managing it needs an owner link, loopback, or the server's admin token.
  rpc GetAccess(GetAccessRequest) returns (GetAccessResponse);
  rpc EnableAccess(EnableAccessRequest) returns (EnableAccessResponse);
  rpc DisableAccess(DisableAccessRequest) returns (DisableAccessResponse);
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse);
  // Reads a Figma .fig file into nodes (experimental).
  rpc ImportFig(ImportFigRequest) returns (ImportFigResponse);
  // Whether a document is a branch, and of what.
  rpc GetBranchOrigin(GetBranchOriginRequest) returns (GetBranchOriginResponse);
  // What merging a branch back into its original would change, conflicts included.
  rpc ReviewMerge(ReviewMergeRequest) returns (ReviewMergeResponse);
  // Merges a branch back into its original (as ordinary ops there, all or nothing).
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (DocInfo);
  // Renames a document (meta.json + the hub's in-memory name).
  rpc RenameDocument(RenameDocumentRequest) returns (DocInfo);
  // Deletes a document by MOVING the bundle to <workspace>/.trash (never rm -rf).
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc OpenDocument(OpenRequest) returns (OpenResponse);
  // Submits an operation. The broadcast to all clients goes through Subscribe.
  rpc SubmitOp(SubmitOpRequest) returns (SubmitOpResponse);
  // Stream of the applied OpRecords: catch-up from since_seq, then live.
  rpc Subscribe(SubscribeRequest) returns (stream ServerMsg);
  // Presence: the stream first sends the list of who is already there, then the
  // updates. Closing it = leaving the document.
  rpc WatchPresence(WatchPresenceRequest) returns (stream PresenceEvent);
  // Updates the client's cursor/selection (which must have an open stream).
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
  // Flow analysis (screen graph): unreachable screens, dead ends, paths.
  // Computed by the server (internal/flow), so UI, CLI and MCP agents see the
  // same result.
  rpc AnalyzeFlows(AnalyzeFlowsRequest) returns (AnalyzeFlowsResponse);
  // Exports the design as code (internal/codegen): the list of files of the
  // generated project, computed from the current snapshot. As with
  // AnalyzeFlows, CLI, MCP and editor see the same result.
  rpc ExportCode(ExportCodeRequest) returns (ExportCodeResponse);
  // Draws a diagram (flowchart, UML classes, UML sequence, UML states) from
  // Mermaid text. Pure and stateless: see RenderDiagramRequest.
  rpc RenderDiagram(RenderDiagramRequest) returns (RenderDiagramResponse);
}
