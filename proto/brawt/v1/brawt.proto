syntax = "proto3";
package brawt.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/bernardoforcillo/brawt/gen/brawt/v1;brawtv1";

// ---------- documento / scene graph ----------
message Color { float r = 1; float g = 2; float b = 3; float a = 4; } // 0..1
message SolidPaint { Color color = 1; }
message Paint { oneof kind { SolidPaint solid = 1; } }

message RectNode { double corner_radius = 1; }
message EllipseNode {} // cx/cy/rx/ry derivano da x/y/width/height, come per RectNode

// Un GRUPPO è un contenitore SENZA clipping e senza geometria propria: i suoi
// bounds sono l'UNIONE di quelli dei figli (derivati, non memorizzati) e non ha
// niente da riempire -- non si disegna e non si colpisce, si colpiscono i figli.
//
// Il messaggio è quindi vuoto, e non è un difetto: ciò che rende un nodo un
// gruppo è la sua POSIZIONE nell'albero (i figli) più il caso del oneof, che
// dice a renderer, hit-test e politica di selezione come trattarlo. Un
// FrameNode (34) avrà invece campi propri (clips_content) e bounds propri.
//
// x/y restano significativi: sono la TRASLAZIONE che il gruppo contribuisce ai
// figli (vedi web/src/canvas/transform.ts::localTransformOf) -- valgono 0 alla
// creazione, così raggruppare non sposta nulla, e cambiano quando il gruppo
// viene trascinato. width/height non sono usati da nessuno: i bounds sono
// l'unione dei figli.
message GroupNode {}

// Un FRAME è l'opposto complementare del gruppo: un contenitore CON geometria
// propria. Il suo box (x/y/width/height del Node) non è derivato dai figli --
// è disegnato, riempito e colpito come una forma qualunque -- ed è l'artboard:
// la superficie su cui si compone, non solo un raggruppamento logico.
//
// Da qui discende tutto il resto:
//   - si disegna (a differenza di un gruppo) e si colpisce sul proprio box,
//     quindi cliccare la parte vuota di un frame seleziona il frame;
//   - i suoi bounds sono i suoi, mai l'unione dei figli (store/groups.ts::
//     contentWorldBounds risale ai figli SOLO per i gruppi);
//   - il click NON viene catturato come da un gruppo: i figli di un frame si
//     selezionano direttamente, che è la convenzione degli artboard
//     (store/groups.ts::selectionTargetOf).
message FrameNode {
  // Ritaglia i figli al box del frame. Non è un dettaglio di rendering: ciò
  // che il ritaglio nasconde non è nemmeno CLICCABILE né selezionabile con la
  // banda elastica -- le tre discese dell'albero (disegno, hit-test, marquee)
  // devono rispondere sugli stessi pixel, altrimenti la selezione finisce su
  // un nodo che l'utente non vede.
  //
  // Opzionale, cioè un campo e non un invariante del frame: un frame senza
  // clipping resta un contenitore con bounds propri (utile per raggruppare
  // dando una cornice esplicita), e il default proto3 (false) è quindi un
  // valore legittimo, non "non impostato".
  bool clips_content = 1;
}

enum TextAlign {
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_LEFT = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_RIGHT = 3;
}

message TextStyle {
  string font_family = 1;    // "" => default del renderer
  double font_size = 2;      // px in coordinate mondo
  string font_weight = 3;    // "400" | "700" | ...
  double line_height = 4;    // moltiplicatore, 0 => 1.2
  TextAlign align = 5;       // LEFT | CENTER | RIGHT
}

// Il box del testo è x/y/width/height del Node (come rect/ellipse): width è la
// larghezza di wrap, height quella misurata dal layout.
message TextNode { string content = 1; TextStyle style = 2; }

message Node {
  string id = 1;
  string parent_id = 2;   // id nodo container OPPURE id Page (per i root)
  string order_key = 3;   // fractional index
  string name = 4;
  bool visible = 5;
  double opacity = 6;     // 0..1
  double x = 10; double y = 11; double width = 12; double height = 13; double rotation = 14;
  repeated Paint fills = 20;
  oneof shape {
    RectNode rect = 30;
    EllipseNode ellipse = 31;
    TextNode text = 32;
    // Numeri assegnati in anticipo alle quattro tracce parallele. Ogni traccia
    // sostituisce SOLO la propria riga con la dichiarazione vera (e definisce il
    // messaggio corrispondente): righe distinte si fondono senza conflitti.
    GroupNode group = 33;
    FrameNode frame = 34;
    // 35 = ImageNode     (traccia 3 — periferia)
    // 36 = VectorNode    (traccia 4 — vettoriale)
    // 37 = InstanceNode  (M4 — componenti)
  }
}

message Page { string id = 1; string name = 2; }

message Document {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  repeated Page pages = 4;
  map<string, Node> nodes = 5;
}

// ---------- op ----------
message CreateNode { Node node = 1; }
message DeleteNode { string id = 1; }
message SetProperties {
  string id = 1;
  Node patch = 2;
  google.protobuf.FieldMask mask = 3; // path dot su Node, es. "x","y","fills"
}
// Op dedicato invece di un path della mask di SetProperties: il contenuto del
// testo vive DENTRO il oneof `shape`, mentre la mask di SetProperties indirizza
// campi di primo livello del Node. Un path annidato ("text.content") costringerebbe
// entrambe le implementazioni di apply a un parser di path.
//
// `style_present` distingue "non specificato" da "azzera": in proto3 un
// sotto-messaggio assente e uno con tutti i campi a zero sono indistinguibili
// dopo il round-trip protojson, quindi senza il flag un SetText di solo
// contenuto azzererebbe lo stile del nodo. style_present=false => lascia stare
// lo stile esistente; true => sostituiscilo con `style` (anche se vuoto).
message SetText {
  string id = 1;
  string content = 2;
  TextStyle style = 3;
  bool style_present = 4;
}
// Sposta un nodo sotto un altro container (o direttamente sotto una Page) e ne
// riscrive l'ordine fra i nuovi pari.
//
// Op dedicato e non un path della mask di SetProperties -- a differenza di
// `order_key`, che è un campo come gli altri -- perché la riparentazione ha una
// VALIDAZIONE propria che nessun altro campo ha: il nuovo parent deve esistere
// (nodo o pagina) e non può essere il nodo stesso né un suo discendente,
// altrimenti il sottoalbero si stacca dal documento e diventa un ciclo
// irraggiungibile. Una mask che scrivesse `parent_id` costringerebbe
// applySetProps (e la sua gemella TS) a portarsi dentro l'attraversamento
// dell'albero solo per un path.
//
// `order_key` viaggia INSIEME: cambiare parent senza riordinare lascerebbe il
// nodo con la chiave calcolata fra i pari VECCHI, cioè in una posizione
// arbitraria fra i nuovi. Un solo op, una sola posizione finale.
message ReparentNode {
  string id = 1;
  string new_parent_id = 2; // id nodo container OPPURE id Page
  string order_key = 3;     // fractional index fra i nuovi pari
}
// ---------- pagine ----------
// Le pagine sono i container RADICE del documento: ogni nodo pende da una di
// loro (Node.parent_id accetta un id di nodo OPPURE di Page) e il canvas ne
// mostra una alla volta. `Document.pages` esisteva da M0 con una pagina sola e
// nessun op capace di toccarla; questi tre la rendono un documento a più
// pagine.
//
// Tre op dedicati e non dei path della mask di SetProperties: la mask indirizza
// campi di un NODE (è il suo id a viaggiare in SetProperties.id) e una pagina
// non è un nodo -- non ha geometria, non ha forma, non ha parent. Un
// "SetProperties su una pagina" costringerebbe entrambe le implementazioni di
// apply a due tabelle di path disgiunte sotto lo stesso op.
message CreatePage { Page page = 1; }
// Cancella la pagina E TUTTI i nodi che ci pendono, a cascata (stessa regola di
// DeleteNode: ciò che non è più raggiungibile da una pagina non fa più parte
// del documento). Rifiutata sull'ULTIMA pagina rimasta: un documento senza
// pagine non ha nessun posto in cui creare un nodo.
message DeletePage { string id = 1; }
message RenamePage { string id = 1; string name = 2; }

message Op {
  string op_id = 1;
  string doc_id = 2;
  oneof kind {
    CreateNode    create_node = 10;
    SetProperties set_props   = 11;
    DeleteNode    delete_node = 12;
    SetText       set_text    = 13;
    ReparentNode  reparent_node = 14; // traccia 1 — sposta un nodo sotto un altro parent
    // Pagine multiple (traccia 1). Numeri PRESI DOPO quelli già assegnati alle
    // altre tracce (15 e 16 qui sotto): le righe restano distinte e i merge
    // puliti, esattamente come per il oneof `shape`.
    CreatePage    create_page   = 17;
    DeletePage    delete_page   = 18;
    RenamePage    rename_page   = 19;
    // Come sopra: una riga per traccia, sostituita dalla dichiarazione vera.
    // 15 = SetVectorPath   (traccia 4 — sostituisce i subpath di un VectorNode)
    // 16 = CreateComponent (M4)
  }
}
message OpRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string client_id = 3;
  Op op = 4;
}

// ---------- servizio ----------
message OpenRequest  { string doc_id = 1; }
message OpenResponse { Document snapshot = 1; uint64 seq = 2; }
message CreateDocumentRequest { string name = 1; }
message DocInfo { string id = 1; string name = 2; }
message ListDocumentsRequest {}
message ListDocumentsResponse { repeated DocInfo docs = 1; }

// Il canale live è diviso in due RPC invece di uno stream bidirezionale: il
// `fetch` dei browser non supporta i request body in streaming, quindi un bidi
// non è raggiungibile dall'editor. Un unary in salita + un server-stream in
// discesa danno la stessa semantica e funzionano ovunque.
message SubmitOpRequest  { string doc_id = 1; string client_id = 2; Op op = 3; }
message SubmitOpResponse { Ack ack = 1; }

message SubscribeRequest { string doc_id = 1; string client_id = 2; uint64 since_seq = 3; }

message Ack      { string op_id = 1; uint64 seq = 2; }
message ErrorMsg { string op_id = 1; string message = 2; }
message ServerMsg { oneof kind { OpRecord applied = 1; Ack ack = 2; ErrorMsg error = 3; } }

service DocumentService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (DocInfo);
  rpc OpenDocument(OpenRequest) returns (OpenResponse);
  // Invia un'operazione. Il broadcast a tutti i client passa da Subscribe.
  rpc SubmitOp(SubmitOpRequest) returns (SubmitOpResponse);
  // Stream degli OpRecord applicati: catch-up da since_seq, poi live.
  rpc Subscribe(SubscribeRequest) returns (stream ServerMsg);
}
