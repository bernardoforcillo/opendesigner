syntax = "proto3";
package brawt.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/bernardoforcillo/brawt/gen/brawt/v1;brawtv1";

// ---------- documento / scene graph ----------
message Color { float r = 1; float g = 2; float b = 3; float a = 4; } // 0..1
message SolidPaint { Color color = 1; }
message Paint { oneof kind { SolidPaint solid = 1; } }

// Allineamento del tratto rispetto al PERIMETRO della forma. CENTER è il
// default del disegno (metà dentro, metà fuori): è l'unico che il canvas 2D sa
// fare da solo, gli altri due si ottengono raddoppiando la larghezza e
// ritagliando il lato che non serve (vedi web/src/renderer/canvasRenderer.ts).
//
// UNSPECIFIED = 0 come in TextAlign, e per la stessa ragione: in proto3 lo zero
// non si distingue da "campo assente", quindi il valore 0 non può essere una
// scelta vera dell'utente -- collassa su CENTER al bordo del renderer, dove
// vivono tutti i default (web/src/store/types.ts::toStrokeLite).
enum StrokeAlign {
  STROKE_ALIGN_UNSPECIFIED = 0;
  STROKE_ALIGN_CENTER = 1;
  STROKE_ALIGN_INSIDE = 2;
  STROKE_ALIGN_OUTSIDE = 3;
}

// Un tratto: la stessa Paint dei riempimenti, più la larghezza (in coordinate
// MONDO, come font_size) e l'allineamento. Messaggio a sé e non tre campi
// paralleli sul Node, perché `strokes` è ripetuto esattamente come `fills`: un
// nodo può avere più tratti sovrapposti, e ciascuno ha il PROPRIO peso.
message Stroke {
  Paint paint = 1;
  double weight = 2;      // >= 0, in coordinate mondo
  StrokeAlign align = 3;
}

message RectNode { double corner_radius = 1; }
message EllipseNode {} // cx/cy/rx/ry derivano da x/y/width/height, come per RectNode

enum TextAlign {
  TEXT_ALIGN_UNSPECIFIED = 0;
  TEXT_ALIGN_LEFT = 1;
  TEXT_ALIGN_CENTER = 2;
  TEXT_ALIGN_RIGHT = 3;
}

message TextStyle {
  string font_family = 1;    // "" => default del renderer
  double font_size = 2;      // px in coordinate mondo
  string font_weight = 3;    // "400" | "700" | ...
  double line_height = 4;    // moltiplicatore, 0 => 1.2
  TextAlign align = 5;       // LEFT | CENTER | RIGHT
}

// Il box del testo è x/y/width/height del Node (come rect/ellipse): width è la
// larghezza di wrap, height quella misurata dal layout.
message TextNode { string content = 1; TextStyle style = 2; }

// L'immagine è un RIFERIMENTO, mai dei byte. `asset_hash` è lo sha256 dei byte
// in esadecimale minuscolo; i byte vivono UNA volta sola in
// <workspace>/<docId>.brawt/assets/ e si servono via GET /assets-api/{docId}/{hash}.
//
// È il punto dell'indirizzamento per contenuto: un CreateNode con dentro
// un'immagine porterebbe quei byte nell'op-log, cioè in un file append-only che
// non si compatta mai per intero -- la stessa foto trascinata dieci volte
// pesherebbe dieci volte, e ogni catch-up di Subscribe la rimanderebbe sul filo.
// Con l'hash l'op resta di poche decine di byte e i pixel non entrano mai nel
// giro degli op.
message ImageNode { string asset_hash = 1; }

// Un punto d'ancoraggio di un path vettoriale.
//
// DUE SPAZI, ed è la regola più importante di tutto il messaggio -- il renderer,
// l'hit-test e il pen tool devono leggerla nello stesso identico modo, in Go e
// in TypeScript (web/src/store/vectorGeometry.ts è l'unica implementazione).
//
// 1. `x`/`y` sono in coordinate LOCALI AL NODO: l'origine è (Node.x, Node.y),
//    quindi il punto in coordinate mondo è (Node.x + x, Node.y + y).
//    NON in coordinate mondo, e non è un capriccio: ogni consumatore esistente
//    lavora sul box del nodo -- selectTool manda un setProps{x,y} per
//    trascinare, l'overlay disegna la selezione da x/y/width/height, il
//    renderer scarta un nodo con width/height <= 0. Con ancoraggi in coordinate
//    mondo, trascinare un nodo vettoriale sposterebbe il box e lascerebbe il
//    path dov'era, a meno di riscrivere TUTTA la geometria a ogni spostamento
//    (una regola in più che nessuno applica). Locali, la geometria viaggia col
//    nodo gratis -- e sarà così anche quando la traccia 1 renderà le coordinate
//    relative al parent: un vettoriale dentro un gruppo si sposterà col gruppo
//    senza una riga in più.
//
// 2. `in_`/`out_` sono OFFSET RELATIVI ALL'ANCORAGGIO (non punti): il punto di
//    controllo della curva che ENTRA nell'ancoraggio è (x + in_x, y + in_y),
//    quello della curva che ne ESCE è (x + out_x, y + out_y).
//    Relativi perché così -- e SOLO così -- il default di proto3 dice il vero:
//    (0,0) è la maniglia COINCIDENTE con l'ancoraggio, cioè "nessuna maniglia,
//    il segmento è una retta". Con maniglie assolute un ancoraggio decodificato
//    senza in_/out_ avrebbe le maniglie nell'ORIGINE del nodo, cioè una curva
//    che ci va a sbattere: il caso più comune di tutti (un punto d'angolo)
//    sarebbe l'unico non rappresentabile allo zero, e ogni scrittore dovrebbe
//    ricordarsi di riempire i sei campi anche quando non servono.
//    È anche la ragione per cui la maggior parte dei formati le tiene relative.
//    Il prezzo -- una somma nel renderer -- lo paga un solo posto
//    (vectorGeometry.ts), e per giunta gratis: bezierCurveTo con entrambi i
//    controlli coincidenti agli estremi disegna esattamente la retta, quindi il
//    caso "nessuna maniglia" non ha nemmeno bisogno di un ramo.
message Anchor {
  double x = 1; double y = 2;
  double in_x = 3; double in_y = 4;
  double out_x = 5; double out_y = 6;
}

// Un contorno: una sequenza di ancoraggi, chiusa o aperta. `closed` è dato e
// non derivato (primo ancoraggio == ultimo): un path chiuso si riempie e si
// hit-testa sul riempimento, uno aperto sulla prossimità alla linea.
message SubPath { repeated Anchor anchors = 1; bool closed = 2; }

// Più subpath per nodo: un contorno esterno e i suoi buchi (o più contorni
// scollegati) sono UN oggetto per l'utente, quindi un nodo solo.
//
// IL BOX. Node.x/y/width/height restano quello che sono per rect ed ellipse: il
// box del nodo. Non sono derivati dalla geometria da chi applica l'op -- né
// core.Apply né applyOp li ricalcolano -- perché la bbox di una cubica non è
// una copia di due righe e due implementazioni "identiche" di quella
// matematica divergerebbero al primo caso limite, proprio sull'invariante che
// questa traccia esiste per difendere.
//
// L'invariante è quindi del SCRITTORE, e vale la pena scriverla per esteso:
// dopo un SetVectorPath, la bbox locale della geometria è (0,0)-(width,height).
// Cioè: chi riscrive i subpath normalizza (trasla gli ancoraggi in modo che il
// minimo sia (0,0)) e manda nello STESSO GESTO il SetProperties che aggiorna
// x/y/width/height. Così un nodo vettoriale è indistinguibile da un rettangolo
// per tutto il resto dell'editor: la selezione lo circonda, il resize ha un box
// su cui lavorare, e il pen tool è l'unico posto che conosce la regola.
// web/src/store/vectorGeometry.ts::vectorBounds è l'unica implementazione della
// bbox, così "scritto due volte" non è nemmeno possibile. Ed è la bbox VERA
// della curva (derivata risolta per asse, e solo sui segmenti effettivamente
// disegnati), non l'inviluppo dei punti di controllo: su quest'ultimo il box
// dichiarato qui sarebbe un sovrainsieme -- fino a un 33% di vuoto su una sola
// cubica -- e a pagarlo sarebbe la SELEZIONE, con maniglie di resize che non
// toccano il path e un marquee che afferra senza sfiorare l'inchiostro.
//
// Vale nei DUE VERSI, ed è il secondo a costare qualcosa: nemmeno il BOX può
// cambiare senza che la geometria lo segua, altrimenti un drag delle 8 maniglie
// di resize (che è un solo SetProperties{x,y,width,height}) violerebbe
// l'invariante senza nessun SetVectorPath in vista -- box cresciuto, inchiostro
// della misura di prima. Chi ridimensiona un nodo vettoriale riscrive quindi gli
// ancoraggi con la stessa trasformazione, NELLO STESSO GESTO
// (web/src/store/vectorGeometry.ts::resizeVector, emesso da
// web/src/tools/selectTool.ts). Gli ancoraggi restano lunghezze in coordinate
// locali e NON frazioni 0..1 del box: normalizzati sarebbero indefiniti per ogni
// path con un asse degenere (un segmento orizzontale: divisione per zero) e
// costringerebbero il pen tool a rinormalizzare tutta la geometria a ogni punto
// aggiunto.
//
// Un asse DEGENERE è uno stato legittimo e il box non lo falsa: un path di un
// solo ancoraggio ha width e height 0, un segmento orizzontale ha height 0. Il
// click non passa dal box (colpisce l'inchiostro,
// web/src/renderer/shapes.ts::hitTestNode), e chi ci deve far passare sopra un
// MARQUEE allarga per conto suo
// (web/src/renderer/shapes.ts::selectionBoundsOfNode) -- quella è una tolleranza
// di selezione, non un fatto sulla geometria.
message VectorNode { repeated SubPath subpaths = 1; }

message Node {
  string id = 1;
  string parent_id = 2;   // id nodo container OPPURE id Page (per i root)
  string order_key = 3;   // fractional index
  string name = 4;
  bool visible = 5;
  double opacity = 6;     // 0..1
  double x = 10; double y = 11; double width = 12; double height = 13; double rotation = 14;
  repeated Paint fills = 20;
  // Il numero 21 era RISERVATO dal design fin dall'inizio e ora è implementato
  // (traccia 2). Ripetuto come `fills`, e con la stessa semantica di scrittura:
  // la mask "strokes" SOSTITUISCE l'intera lista, non ne fonde gli elementi.
  repeated Stroke strokes = 21;
  oneof shape {
    RectNode rect = 30;
    EllipseNode ellipse = 31;
    TextNode text = 32;
    // Numeri assegnati in anticipo alle quattro tracce parallele. Ogni traccia
    // sostituisce SOLO la propria riga con la dichiarazione vera (e definisce il
    // messaggio corrispondente): righe distinte si fondono senza conflitti.
    // 33 = GroupNode     (traccia 1 — annidamento)
    // 34 = FrameNode     (traccia 1 — annidamento)
    ImageNode image = 35;   // traccia 3 — periferia (vedi ImageNode sopra)
    VectorNode vector = 36; // traccia 4 — vettoriale (vedi VectorNode sopra)
    // 37 = InstanceNode  (M4 — componenti)
  }
}

message Page { string id = 1; string name = 2; }

message Document {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  repeated Page pages = 4;
  map<string, Node> nodes = 5;
}

// ---------- op ----------
message CreateNode { Node node = 1; }
message DeleteNode { string id = 1; }
message SetProperties {
  string id = 1;
  Node patch = 2;
  google.protobuf.FieldMask mask = 3; // path dot su Node, es. "x","y","fills"
}
// Op dedicato invece di un path della mask di SetProperties: il contenuto del
// testo vive DENTRO il oneof `shape`, mentre la mask di SetProperties indirizza
// campi di primo livello del Node. Un path annidato ("text.content") costringerebbe
// entrambe le implementazioni di apply a un parser di path.
//
// `style_present` distingue "non specificato" da "azzera": in proto3 un
// sotto-messaggio assente e uno con tutti i campi a zero sono indistinguibili
// dopo il round-trip protojson, quindi senza il flag un SetText di solo
// contenuto azzererebbe lo stile del nodo. style_present=false => lascia stare
// lo stile esistente; true => sostituiscilo con `style` (anche se vuoto).
message SetText {
  string id = 1;
  string content = 2;
  TextStyle style = 3;
  bool style_present = 4;
}
// Sostituisce IN BLOCCO i subpath di un VectorNode. Op dedicato invece di un
// path della mask di SetProperties per la stessa ragione di SetText: la
// geometria vive DENTRO il oneof `shape`, mentre la mask indirizza campi di
// primo livello del Node.
//
// La sostituzione è wholesale e non incrementale (nessun "sposta l'ancoraggio
// i-esimo"): un gesto della penna può aggiungere, spostare e cancellare
// ancoraggi tutti insieme, e un op per micro-modifica moltiplicherebbe i casi
// da tenere identici fra Go e TS senza aggiungere nulla -- l'inverso è
// comunque i subpath PRECEDENTI per intero.
//
// Una lista VUOTA è legittima e non è "non specificato": è il path che l'utente
// ha svuotato. Nessun flag `present` serve qui (a differenza di
// SetText.style_present) perché non esiste nessun altro campo dell'op che
// possa restare intatto: l'op È i subpath.
message SetVectorPath {
  string id = 1;
  repeated SubPath subpaths = 2;
}
message Op {
  string op_id = 1;
  string doc_id = 2;
  oneof kind {
    CreateNode    create_node = 10;
    SetProperties set_props   = 11;
    DeleteNode    delete_node = 12;
    SetText       set_text    = 13;
    // Come sopra: una riga per traccia, sostituita dalla dichiarazione vera.
    // 14 = ReparentNode    (traccia 1 — sposta un nodo sotto un altro parent)
    SetVectorPath set_vector_path = 15;
    // 16 = CreateComponent (M4)
  }
}
message OpRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string client_id = 3;
  Op op = 4;
}

// ---------- servizio ----------
message OpenRequest  { string doc_id = 1; }
message OpenResponse { Document snapshot = 1; uint64 seq = 2; }
message CreateDocumentRequest { string name = 1; }
message DocInfo { string id = 1; string name = 2; }
message ListDocumentsRequest {}
message ListDocumentsResponse { repeated DocInfo docs = 1; }

// Il canale live è diviso in due RPC invece di uno stream bidirezionale: il
// `fetch` dei browser non supporta i request body in streaming, quindi un bidi
// non è raggiungibile dall'editor. Un unary in salita + un server-stream in
// discesa danno la stessa semantica e funzionano ovunque.
message SubmitOpRequest  { string doc_id = 1; string client_id = 2; Op op = 3; }
message SubmitOpResponse { Ack ack = 1; }

message SubscribeRequest { string doc_id = 1; string client_id = 2; uint64 since_seq = 3; }

message Ack      { string op_id = 1; uint64 seq = 2; }
message ErrorMsg { string op_id = 1; string message = 2; }
message ServerMsg { oneof kind { OpRecord applied = 1; Ack ack = 2; ErrorMsg error = 3; } }

service DocumentService {
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (DocInfo);
  rpc OpenDocument(OpenRequest) returns (OpenResponse);
  // Invia un'operazione. Il broadcast a tutti i client passa da Subscribe.
  rpc SubmitOp(SubmitOpRequest) returns (SubmitOpResponse);
  // Stream degli OpRecord applicati: catch-up da since_seq, poi live.
  rpc Subscribe(SubscribeRequest) returns (stream ServerMsg);
}
