<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.visibile-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 50px;
  height: 50px;
  background-color: #e54d4d;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="visibile-2" data-node-id="v"></div>
  </div>
</body>
</html>
