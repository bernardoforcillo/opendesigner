<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.foto-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 120px;
  height: 90px;
  background-color: rgba(0,0,0,0.06);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
}
.svg-3 {
  position: absolute;
  left: 0;
  top: 0;
  max-width: none;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="foto-2" data-node-id="i" role="img" aria-label="foto">
      <svg class="svg-3" width="120" height="90" aria-hidden="true">
        <path d="M0 0L120 90M120 0L0 90" fill="none" stroke="rgba(0,0,0,0.35)"></path>
      </svg>
    </div>
  </div>
</body>
</html>
