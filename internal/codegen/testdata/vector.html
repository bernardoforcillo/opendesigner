<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.aperto-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 100px;
  height: 60px;
  overflow: visible;
  max-width: none;
}
.buco-3 {
  position: absolute;
  left: 140px;
  top: 10px;
  width: 90px;
  height: 90px;
  overflow: visible;
  max-width: none;
}
.punto-4 {
  position: absolute;
  left: 260px;
  top: 20px;
  width: 0;
  height: 0;
  overflow: visible;
  max-width: none;
}
.sfumato-5 {
  position: absolute;
  left: 10px;
  top: 120px;
  width: 100px;
  height: 100px;
  overflow: visible;
  max-width: none;
  filter: drop-shadow(4px 6px 4px rgba(0,0,0,0.5));
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <svg class="aperto-2" data-node-id="o" width="100" height="60">
      <path d="M0 50C20 -10 30 0 50 0C70 0 80 -10 100 50" fill="none" stroke="#cc1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg class="buco-3" data-node-id="h" width="90" height="90">
      <path d="M0 0L90 0L90 90L0 90L0 0Z M25 25L65 25L65 65L25 65L25 25Z" fill="#3366e5" fill-rule="evenodd"></path>
      <path d="M0 0L90 0L90 90L0 90L0 0Z M25 25L65 25L65 65L25 65L25 25Z" fill="none" stroke="#3366e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg class="punto-4" data-node-id="p" width="0" height="0">
      <path d="M0 0L0 0" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg class="sfumato-5" data-node-id="g" width="100" height="100">
      <defs>
        <linearGradient id="g-g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ff8000"></stop>
          <stop offset="1" stop-color="#991acc"></stop>
        </linearGradient>
      </defs>
      <path d="M50 0C80 0 100 20 100 50C100 80 80 100 50 100C20 100 0 80 0 50C0 20 20 0 50 0Z" fill="url(#g-g)" fill-rule="evenodd" opacity="0.5"></path>
      <path opacity="0.5" d="M50 0C80 0 100 20 100 50C100 80 80 100 50 100C20 100 0 80 0 50C0 20 20 0 50 0Z" fill="none" stroke="#ff8000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
</body>
</html>
