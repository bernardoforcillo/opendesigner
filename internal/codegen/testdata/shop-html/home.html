<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Home" del documento "Negozio" (shop). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.home-1 {
  position: relative;
  width: 360px;
  height: 560px;
  overflow: hidden;
  background-color: #f7f7fc;
}
.titolo-2 {
  position: absolute;
  left: 24px;
  top: 48px;
  width: 312px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  color: #1a1a1f;
}
.prodotto-3 {
  position: absolute;
  left: 24px;
  top: 112px;
  width: 312px;
  height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 8px;
  padding: 16px;
  background-color: #fff;
  box-shadow: 0 0 0 0.5px #e0e0eb,inset 0 0 0 0.5px #e0e0eb,0 4px 12px rgba(0,0,0,0.12);
  text-decoration: none;
}
.nome-prodotto-4 {
  position: relative;
  flex-shrink: 0;
  width: 280px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  height: 24px;
  font-family: Inter, sans-serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.2;
  color: #1a1a1f;
}
.prezzo-5 {
  position: relative;
  flex-shrink: 0;
  width: 280px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  height: 20px;
  font-family: Inter, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.2;
  color: #666673;
}
.foto-6 {
  position: relative;
  flex-shrink: 0;
  width: 280px;
  height: 72px;
  background-color: rgba(0,0,0,0.06);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
}
.svg-7 {
  position: absolute;
  left: 0;
  top: 0;
  max-width: none;
}
.nota-8 {
  position: absolute;
  left: 24px;
  top: 300px;
  width: 312px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.2;
  color: #666673;
}
</style>
</head>
<body>
  <div class="home-1" data-node-id="home">
    <div class="titolo-2" data-node-id="homeTitle">Vetrina</div>
    <!-- flow: t2 -->
    <a class="prodotto-3" data-node-id="homeCard" href="dettaglio.html" aria-label="Apri dettaglio">
      <div class="nome-prodotto-4" data-node-id="homeCardName">Cuffie wireless</div>
      <div class="prezzo-5" data-node-id="homeCardPrice">89,00 EUR</div>
      <div class="foto-6" data-node-id="homeCardImg" role="img" aria-label="Foto">
        <svg class="svg-7" width="280" height="72" aria-hidden="true">
          <path d="M0 0L280 72M280 0L0 72" fill="none" stroke="rgba(0,0,0,0.35)"></path>
        </svg>
      </div>
    </a>
    <div class="nota-8" data-node-id="homeNote">Tocca un prodotto per i dettagli</div>
    <nav class="nav-hidden" aria-label="Navigazione del flusso">
      <!-- flow: t3 -->
      <a href="index.html">Esci</a>
    </nav>
  </div>
</body>
</html>
