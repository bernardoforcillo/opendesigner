<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Login" del documento "Negozio" (shop). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.login-1 {
  position: relative;
  width: 360px;
  height: 560px;
  overflow: hidden;
  background-color: #f7f7fc;
}
.titolo-2 {
  position: absolute;
  left: 24px;
  top: 48px;
  width: 312px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  color: #1a1a1f;
}
.campo-email-3 {
  position: absolute;
  left: 24px;
  top: 120px;
  width: 312px;
  height: 48px;
  border-radius: 10px;
  background-color: #fff;
  box-shadow: inset 0 0 0 1px #ccccd9;
}
.campo-password-4 {
  position: absolute;
  left: 24px;
  top: 184px;
  width: 312px;
  height: 48px;
  border-radius: 10px;
  background-color: #fff;
  box-shadow: inset 0 0 0 1px #ccccd9;
}
.pulsante-accedi-5 {
  position: absolute;
  left: 24px;
  top: 264px;
  width: 312px;
  height: 52px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #3366f2;
  text-decoration: none;
}
.etichetta-6 {
  position: relative;
  flex-shrink: 0;
  width: 120px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  height: 20px;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  color: #fff;
}
</style>
</head>
<body>
  <div class="login-1" data-node-id="login">
    <div class="titolo-2" data-node-id="loginTitle">Accedi al negozio</div>
    <div class="campo-email-3" data-node-id="loginEmail"></div>
    <div class="campo-password-4" data-node-id="loginPass"></div>
    <!-- flow: t1 | guard: credenziali valide | effect: sessione attiva -->
    <a class="pulsante-accedi-5" data-node-id="loginBtn" data-testid="login-submit" href="home.html" aria-label="Accedi">
      <div class="etichetta-6" data-node-id="loginBtnLabel">Entra</div>
    </a>
  </div>
</body>
</html>
