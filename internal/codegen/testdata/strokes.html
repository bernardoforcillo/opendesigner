<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.centro-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 100px;
  height: 80px;
  background-color: #e5e5e5;
  box-shadow: 0 0 0 4px #000,inset 0 0 0 4px #000;
}
.dentro-3 {
  position: absolute;
  left: 130px;
  top: 10px;
  width: 100px;
  height: 80px;
  border-radius: 14px;
  background-color: #e5e5e5;
  box-shadow: inset 0 0 0 10px #e54d4d;
}
.fuori-4 {
  position: absolute;
  left: 250px;
  top: 10px;
  width: 100px;
  height: 80px;
  border-radius: 50%;
  background-color: #e5e5e5;
  box-shadow: 0 0 0 10px #4db266;
}
.due-5 {
  position: absolute;
  left: 10px;
  top: 110px;
  width: 100px;
  height: 80px;
  background-color: #e5e5e5;
  box-shadow: 0 0 0 4px #3366e5,inset 0 0 0 6px #e54d4d;
}
.peso-zero-6 {
  position: absolute;
  left: 130px;
  top: 110px;
  width: 100px;
  height: 80px;
  background-color: #e5e5e5;
}
.senza-riempimento-7 {
  position: absolute;
  left: 250px;
  top: 110px;
  width: 100px;
  height: 80px;
  background-color: #ccc;
  box-shadow: 0 0 0 1.5px #000,inset 0 0 0 1.5px #000;
}
.testo-8 {
  position: absolute;
  left: 10px;
  top: 220px;
  width: 200px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  color: #000;
  -webkit-text-stroke: 1px #ff8000;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="centro-2" data-node-id="c"></div>
    <div class="dentro-3" data-node-id="i"></div>
    <div class="fuori-4" data-node-id="o"></div>
    <div class="due-5" data-node-id="d"></div>
    <div class="peso-zero-6" data-node-id="z"></div>
    <div class="senza-riempimento-7" data-node-id="n"></div>
    <div class="testo-8" data-node-id="t">Con tratto</div>
  </div>
</body>
</html>
