<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.ombra-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 100px;
  height: 80px;
  background-color: #fff;
  box-shadow: 6px 10px 16px rgba(0,0,0,0.5);
}
.sfocatura-3 {
  position: absolute;
  left: 130px;
  top: 10px;
  width: 100px;
  height: 80px;
  background-color: #e54d4d;
  filter: blur(6px);
}
.ombra-e-sfocatura-4 {
  position: absolute;
  left: 250px;
  top: 10px;
  width: 100px;
  height: 80px;
  border-radius: 50%;
  background-color: #3366e5;
  box-shadow: 8px 8px 6px rgba(0,0,0,0.6);
  filter: blur(1.5px);
}
.traslucido-con-ombra-5 {
  position: absolute;
  left: 10px;
  top: 120px;
  width: 100px;
  height: 80px;
  background-color: rgba(77,178,102,0.5);
  filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.8));
}
.due-ombre-6 {
  position: absolute;
  left: 130px;
  top: 120px;
  width: 100px;
  height: 80px;
  background-color: #fff;
  box-shadow: 8px 8px 4px rgba(255,0,0,0.5);
}
.cornice-opaca-7 {
  position: absolute;
  left: 250px;
  top: 120px;
  width: 100px;
  height: 80px;
  background-color: rgba(26,26,128,0.4);
}
.figlio-8 {
  position: absolute;
  left: 20px;
  top: 20px;
  width: 50px;
  height: 30px;
  background-color: #e5b21a;
}
.testo-9 {
  position: absolute;
  left: 10px;
  top: 230px;
  width: 200px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.2;
  color: #1a1a1a;
  text-shadow: 3px 3px 4px rgba(0,0,0,0.4);
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="ombra-2" data-node-id="s"></div>
    <div class="sfocatura-3" data-node-id="b"></div>
    <div class="ombra-e-sfocatura-4" data-node-id="sb"></div>
    <div class="traslucido-con-ombra-5" data-node-id="tr"></div>
    <div class="due-ombre-6" data-node-id="two"></div>
    <div class="cornice-opaca-7" data-node-id="cf">
      <div class="figlio-8" data-node-id="cfk"></div>
    </div>
    <div class="testo-9" data-node-id="tt">Ombra</div>
  </div>
</body>
</html>
