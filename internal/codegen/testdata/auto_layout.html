<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.riga-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 300px;
  height: 80px;
  display: flex;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  background-color: #e5e5e5;
}
.a-3 {
  position: relative;
  flex-shrink: 0;
  width: 50px;
  height: 30px;
  background-color: #e54d4d;
}
.b-4 {
  position: relative;
  flex-shrink: 0;
  width: 70px;
  height: 50px;
  background-color: #4db266;
}
.gruppo-5 {
  position: absolute;
  left: 5px;
  top: 5px;
  width: 0;
  height: 0;
}
.dentro-6 {
  position: absolute;
  left: 0;
  top: 0;
  width: 10px;
  height: 10px;
  background-color: #3366e5;
}
.colonna-hug-7 {
  position: absolute;
  left: 10px;
  top: 100px;
  width: fit-content;
  height: fit-content;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background-color: #e5e5e5;
}
.c-8 {
  position: relative;
  flex-shrink: 0;
  width: 60px;
  height: 24px;
  background-color: #e54d4d;
}
.d-9 {
  position: relative;
  flex-shrink: 0;
  width: 90px;
  height: 24px;
  background-color: #3366e5;
}
.tra-10 {
  position: absolute;
  left: 10px;
  top: 220px;
  width: 300px;
  height: 60px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 4px;
  padding: 6px 10px;
  background-color: #e5e5e5;
}
.e-11 {
  position: relative;
  flex-shrink: 0;
  width: 40px;
  height: 30px;
  background-color: #e54d4d;
}
.f-12 {
  position: relative;
  flex-shrink: 0;
  width: 40px;
  height: 20px;
  background-color: #3366e5;
}
.testo-in-flusso-13 {
  position: relative;
  flex-shrink: 0;
  width: 100px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  height: 19px;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.2;
  color: #000;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="riga-2" data-node-id="h">
      <div class="a-3" data-node-id="h1"></div>
      <div class="b-4" data-node-id="h2"></div>
      <div class="gruppo-5" data-node-id="hg">
        <div class="dentro-6" data-node-id="hgr"></div>
      </div>
    </div>
    <div class="colonna-hug-7" data-node-id="v">
      <div class="c-8" data-node-id="v1"></div>
      <div class="d-9" data-node-id="v2"></div>
    </div>
    <div class="tra-10" data-node-id="bt">
      <div class="e-11" data-node-id="bt1"></div>
      <div class="f-12" data-node-id="bt2"></div>
      <div class="testo-in-flusso-13" data-node-id="tx">Ciao</div>
    </div>
  </div>
</body>
</html>
