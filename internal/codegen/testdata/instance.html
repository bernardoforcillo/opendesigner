<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.istanza-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 140px;
  height: 90px;
}
.card-3 {
  position: absolute;
  left: 0;
  top: 0;
  width: 140px;
  height: 90px;
  overflow: hidden;
  background-color: #e5e5f2;
}
.etichetta-4 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 60px;
  height: 30px;
  border-radius: 6px;
  background-color: #4d4db2;
}
.titolo-5 {
  position: absolute;
  left: 10px;
  top: 52px;
  width: 120px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  color: #1a1a1a;
}
.con-override-6 {
  position: absolute;
  left: 170px;
  top: 10px;
  width: 140px;
  height: 90px;
}
.card-7 {
  position: absolute;
  left: 0;
  top: 0;
  width: 140px;
  height: 90px;
  overflow: hidden;
  background-color: #e5e5f2;
}
.etichetta-8 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 60px;
  height: 30px;
  border-radius: 6px;
  background-color: #e5661a;
}
.titolo-9 {
  position: absolute;
  left: 10px;
  top: 52px;
  width: 120px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  color: #1a1a1a;
}
.ruotata-10 {
  position: absolute;
  left: 10px;
  top: 130px;
  width: 140px;
  height: 90px;
  transform: rotate(12deg);
}
.card-11 {
  position: absolute;
  left: 0;
  top: 0;
  width: 140px;
  height: 90px;
  overflow: hidden;
  background-color: #e5e5f2;
}
.etichetta-12 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 60px;
  height: 30px;
  border-radius: 6px;
  background-color: #4d4db2;
}
.titolo-13 {
  position: absolute;
  left: 10px;
  top: 52px;
  width: 120px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  color: #1a1a1a;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="istanza-2" data-node-id="i1">
      <div class="card-3" data-node-id="i1/m">
        <div class="etichetta-4" data-node-id="i1/ml"></div>
        <div class="titolo-5" data-node-id="i1/mt">Titolo</div>
      </div>
    </div>
    <div class="con-override-6" data-node-id="i2">
      <div class="card-7" data-node-id="i2/m">
        <div class="etichetta-8" data-node-id="i2/ml"></div>
        <div class="titolo-9" data-node-id="i2/mt">Altro</div>
      </div>
    </div>
    <div class="ruotata-10" data-node-id="i3">
      <div class="card-11" data-node-id="i3/m">
        <div class="etichetta-12" data-node-id="i3/ml"></div>
        <div class="titolo-13" data-node-id="i3/mt">Titolo</div>
      </div>
    </div>
  </div>
</body>
</html>
