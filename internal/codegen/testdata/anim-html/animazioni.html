<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animazioni</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Animazioni" del documento "Animazioni" (anim). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.animazioni-1 {
  position: relative;
  width: 400px;
  height: 420px;
  overflow: hidden;
  background-color: #fff;
}
.card-2 {
  position: absolute;
  left: 20px;
  top: 20px;
  width: 360px;
  height: 100px;
  border-radius: 12px;
  background-color: #3366f2;
  translate: var(--od-x) var(--od-y);
  animation: card-2-animate-opacity 800ms linear 100ms 1 normal both, card-2-animate-y 800ms linear 100ms 1 normal both;
}
.titolo-3 {
  position: absolute;
  left: 36px;
  top: 40px;
  width: 300px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  color: #fff;
  animation: titolo-3-animate-scale 800ms linear 100ms 1 normal both;
}
.logo-4 {
  position: absolute;
  left: 20px;
  top: 140px;
  width: 120px;
  height: 60px;
}
.firma-5 {
  position: absolute;
  left: 0;
  top: 0;
  width: 120px;
  height: 60px;
  overflow: visible;
  max-width: none;
}
.firma-tratto-6 {
  animation: firma-tratto-6-animate-draw 1200ms linear 300ms 1 normal both;
}
.pulsante-7 {
  position: absolute;
  left: 20px;
  top: 230px;
  width: 160px;
  height: 48px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #3366f2;
}
.etichetta-8 {
  position: relative;
  flex-shrink: 0;
  width: 100px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  height: 20px;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  color: #fff;
}
.caricamento-9 {
  position: absolute;
  left: 300px;
  top: 230px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-color: #e54d4d;
  animation: caricamento-9-animate-rotation 1000ms linear 0ms infinite alternate both;
}
.inclinato-10 {
  position: absolute;
  left: 200px;
  top: 330px;
  width: 60px;
  height: 30px;
  transform: rotate(30deg);
  background-color: #4db266;
  translate: var(--od-x) var(--od-y);
}
.card-2.evidenzia {
  animation: card-2-animate-opacity 800ms linear 100ms 1 normal both, card-2-animate-y 800ms linear 100ms 1 normal both, card-2-evidenzia-opacity 300ms linear 0ms 1 normal both;
}
.pulsante-7:hover {
  animation: pulsante-7-hover-scale 200ms linear 0ms 1 normal both;
}
.pulsante-7:active {
  animation: pulsante-7-hover-scale 200ms linear 0ms 1 normal both, pulsante-7-tap-scale 100ms linear 0ms 1 normal both;
}
.pulsante-7:hover .etichetta-8 {
  animation: etichetta-8-hover-opacity 200ms linear 0ms 1 normal both;
}
.inclinato-10:hover {
  animation: inclinato-10-hover-rotation 300ms linear 0ms 1 normal both, inclinato-10-hover-x 300ms linear 0ms 1 normal both;
}
@property --od-x {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --od-y {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@keyframes card-2-animate-opacity {
  0% { opacity:0;animation-timing-function:ease-out }
  100% { opacity:1 }
}
@keyframes card-2-animate-y {
  0% { --od-y:-20px;animation-timing-function:cubic-bezier(0.32,0.66,0.1,1) }
  100% { --od-y:0px }
}
@keyframes card-2-evidenzia-opacity {
  0% { opacity:1;animation-timing-function:linear }
  50% { opacity:0.5;animation-timing-function:linear }
  100% { opacity:1 }
}
@keyframes titolo-3-animate-scale {
  0% { scale:0.8;animation-timing-function:ease-in-out }
  50% { scale:1.1;animation-timing-function:linear }
  100% { scale:1 }
}
@keyframes firma-tratto-6-animate-draw {
  0% { stroke-dasharray:0 1;animation-timing-function:cubic-bezier(0.4,0,0.2,1) }
  100% { stroke-dasharray:1 1 }
}
@keyframes pulsante-7-hover-scale {
  0% { scale:1;animation-timing-function:ease-out }
  100% { scale:1.08 }
}
@keyframes pulsante-7-tap-scale {
  0% { scale:1;animation-timing-function:linear }
  100% { scale:0.95 }
}
@keyframes etichetta-8-hover-opacity {
  0% { opacity:1;animation-timing-function:linear }
  100% { opacity:0.8 }
}
@keyframes caricamento-9-animate-rotation {
  0% { rotate:0deg;animation-timing-function:linear }
  100% { rotate:180deg }
}
@keyframes inclinato-10-hover-rotation {
  0% { rotate:0deg;animation-timing-function:ease-out }
  100% { rotate:30deg }
}
@keyframes inclinato-10-hover-x {
  0% { --od-x:0px;animation-timing-function:linear }
  100% { --od-x:30px }
}
</style>
</head>
<body>
  <div class="animazioni-1" data-node-id="scr">
    <div class="card-2" data-node-id="card" data-testid="card"></div>
    <div class="titolo-3" data-node-id="title" data-testid="title">Benvenuto</div>
    <div class="logo-4" data-node-id="logo">
      <svg class="firma-5" data-node-id="sig" data-testid="sig" width="120" height="60">
        <path class="firma-tratto-6" d="M5 50C15 10 45 10 60 10C75 10 105 10 115 50" fill="none" stroke="#1a1a1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"></path>
      </svg>
    </div>
    <div class="pulsante-7" data-node-id="btn" data-testid="btn">
      <div class="etichetta-8" data-node-id="btnLabel" data-testid="btn-label">Premi</div>
    </div>
    <div class="caricamento-9" data-node-id="spin" data-testid="spin"></div>
    <div class="inclinato-10" data-node-id="tilt" data-testid="tilt"></div>
  </div>
</body>
</html>
