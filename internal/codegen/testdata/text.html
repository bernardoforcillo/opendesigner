<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.a-capo-2 {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 240px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.2;
  color: #1a1a1a;
}
.grassetto-centrato-3 {
  position: absolute;
  left: 10px;
  top: 100px;
  width: 220px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  color: #cc1a4d;
}
.a-destra-4 {
  position: absolute;
  left: 10px;
  top: 150px;
  width: 220px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
  text-align: right;
  color: #1a66cc;
}
.stile-pieno-5 {
  position: absolute;
  left: 10px;
  top: 200px;
  width: 260px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.6;
  color: #333;
}
.senza-larghezza-6 {
  position: absolute;
  left: 10px;
  top: 270px;
  white-space: pre;
  font-family: Inter, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.2;
  color: #000;
}
.senza-fill-7 {
  position: absolute;
  left: 200px;
  top: 270px;
  width: 150px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.2;
  color: #ccc;
}
.speciali-8 {
  position: absolute;
  left: 250px;
  top: 150px;
  width: 140px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-family: Inter, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.2;
  color: #000;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="a-capo-2" data-node-id="a">Hello, design world. This line wraps inside its box.</div>
    <div class="grassetto-centrato-3" data-node-id="b">Bold centered</div>
    <div class="a-destra-4" data-node-id="c">Right 24px</div>
    <div class="stile-pieno-5" data-node-id="d">Interlinea 1.6
con due righe</div>
    <div class="senza-larghezza-6" data-node-id="e">Una riga senza wrap</div>
    <div class="senza-fill-7" data-node-id="f">Grigio di default</div>
    <div class="speciali-8" data-node-id="h">a &lt; b &amp; c &gt; &#34;d&#34;</div>
  </div>
</body>
</html>
