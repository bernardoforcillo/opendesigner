<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermata</title>
<!-- Esportato da opendesigner (opendesigner export): schermata "Schermata" del documento "Prova" (doc). NON modificare a mano:
rigenerare con `opendesigner export`. L'attributo data-node-id lega ogni elemento al nodo del design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.schermata-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.ruotato-2 {
  position: absolute;
  left: 20px;
  top: 20px;
  width: 120px;
  height: 50px;
  transform: rotate(30deg);
  background-color: #333;
}
.antiorario-3 {
  position: absolute;
  left: 200px;
  top: 20px;
  width: 120px;
  height: 50px;
  transform: rotate(-15.5deg);
  background-color: #e54d4d;
}
.cornice-4 {
  position: absolute;
  left: 20px;
  top: 150px;
  width: 130px;
  height: 90px;
  overflow: hidden;
  transform: rotate(15deg);
  background-color: #e5e5e5;
}
.figlio-5 {
  position: absolute;
  left: 60px;
  top: 30px;
  width: 120px;
  height: 80px;
  background-color: #3366e5;
}
.gruppo-6 {
  position: absolute;
  left: 300px;
  top: 200px;
  width: 0;
  height: 0;
  transform: rotate(30deg);
}
.dentro-7 {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 20px;
  background-color: #4db266;
}
.intero-8 {
  position: absolute;
  left: 200px;
  top: 150px;
  width: 40px;
  height: 40px;
  background-color: #e54d4d;
}
</style>
</head>
<body>
  <div class="schermata-1" data-node-id="scr">
    <div class="ruotato-2" data-node-id="r"></div>
    <div class="antiorario-3" data-node-id="rn"></div>
    <div class="cornice-4" data-node-id="rf">
      <div class="figlio-5" data-node-id="rfk"></div>
    </div>
    <div class="gruppo-6" data-node-id="rg">
      <div class="dentro-7" data-node-id="rgk"></div>
    </div>
    <div class="intero-8" data-node-id="r360"></div>
  </div>
</body>
</html>
