<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen</title>
<!-- Exported by opendesigner (opendesigner export): screen "Screen" of document "Test" (doc). DO NOT edit by hand:
regenerate with `opendesigner export`. The data-node-id attribute ties every element to its design node. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img,svg{display:block}
.nav-hidden{position:absolute;left:0;top:0;z-index:50;display:flex;flex-direction:column;opacity:0}
.nav-hidden a{display:block;width:1px;height:1px;overflow:hidden}
.screen-1 {
  position: relative;
  width: 400px;
  height: 300px;
  background-color: #fff;
}
.rotated-2 {
  position: absolute;
  left: 20px;
  top: 20px;
  width: 120px;
  height: 50px;
  transform: rotate(30deg);
  background-color: #333;
}
.counter-clockwise-3 {
  position: absolute;
  left: 200px;
  top: 20px;
  width: 120px;
  height: 50px;
  transform: rotate(-15.5deg);
  background-color: #e54d4d;
}
.frame-4 {
  position: absolute;
  left: 20px;
  top: 150px;
  width: 130px;
  height: 90px;
  overflow: hidden;
  transform: rotate(15deg);
  background-color: #e5e5e5;
}
.child-5 {
  position: absolute;
  left: 60px;
  top: 30px;
  width: 120px;
  height: 80px;
  background-color: #3366e5;
}
.group-6 {
  position: absolute;
  left: 300px;
  top: 200px;
  width: 0;
  height: 0;
  transform: rotate(30deg);
}
.inside-7 {
  position: absolute;
  left: 0;
  top: 0;
  width: 40px;
  height: 20px;
  background-color: #4db266;
}
.full-turn-8 {
  position: absolute;
  left: 200px;
  top: 150px;
  width: 40px;
  height: 40px;
  background-color: #e54d4d;
}
</style>
</head>
<body>
  <div class="screen-1" data-node-id="scr">
    <div class="rotated-2" data-node-id="r"></div>
    <div class="counter-clockwise-3" data-node-id="rn"></div>
    <div class="frame-4" data-node-id="rf">
      <div class="child-5" data-node-id="rfk"></div>
    </div>
    <div class="group-6" data-node-id="rg">
      <div class="inside-7" data-node-id="rgk"></div>
    </div>
    <div class="full-turn-8" data-node-id="r360"></div>
  </div>
</body>
</html>
