# image published on Docker Hub: docker compose up -d
# (to update it: docker compose pull). To build from source: compose.dev.yaml
services:
  opendesigner:
    image: bernardoforcillo/opendesigner:latest
    # the published port listens on all of the host's interfaces:
    # the service is also reachable from the local network
    ports:
      - "${OPENDESIGNER_PORT:-51234}:${OPENDESIGNER_PORT:-51234}"
    # runs as the host's user, so it can write to the mounted directory
    user: "${OPENDESIGNER_UID:-1000}:${OPENDESIGNER_GID:-1000}"
    entrypoint:
      - /opendesigner
      - serve
      - -addr
      - ":${OPENDESIGNER_PORT:-51234}"
      - -workspace
      - /data
    volumes:
      - "${OPENDESIGNER_DIR:-${HOME}/.opendesigner}:/data"
