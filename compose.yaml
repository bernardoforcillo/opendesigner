# immagine pubblicata su Docker Hub: docker compose up -d
# (per aggiornarla: docker compose pull). Per compilare dai sorgenti: compose.dev.yaml
services:
  opendesigner:
    image: bernardoforcillo/opendesigner:latest
    # la porta pubblicata ascolta su tutte le interfacce dell'host:
    # il servizio è raggiungibile anche dalla rete locale
    ports:
      - "${OPENDESIGNER_PORT:-51234}:${OPENDESIGNER_PORT:-51234}"
    # gira con l'utente dell'host, così può scrivere nella cartella montata
    user: "${OPENDESIGNER_UID:-1000}:${OPENDESIGNER_GID:-1000}"
    entrypoint:
      - /opendesigner
      - serve
      - -addr
      - ":${OPENDESIGNER_PORT:-51234}"
      - -workspace
      - /data
    volumes:
      - "${OPENDESIGNER_DIR:-${HOME}/.opendesigner}:/data"
