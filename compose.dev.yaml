# development: like compose.yaml, but the image is built from the local sources
# on every start: docker compose -f compose.dev.yaml up
services:
  opendesigner:
    extends:
      file: compose.yaml
      service: opendesigner
    build: .
    # a local tag, so as not to overwrite the image pulled from Docker Hub
    image: opendesigner:dev
    pull_policy: build
